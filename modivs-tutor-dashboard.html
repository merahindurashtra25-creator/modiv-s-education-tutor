<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Modiv’s Education – Tutor dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#1A2035;--navy2:#2a3350;--yellow:#FABD4E;--cream:#FEF7EA;--card:#fff;--muted:#555b78;--line:#eadfc9;--ok:#1d7a4d;--bad:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--cream);color:var(--navy);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
button,input,select{font:inherit;color:inherit}
:is(a,button,input,select,summary):focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.app{display:grid;grid-template-columns:290px 1fr;gap:24px;max-width:1280px;margin:0 auto;padding:20px 20px 80px;align-items:start}
.side{background:var(--navy);color:var(--cream);border-radius:22px;padding:18px;position:sticky;top:calc(88px + env(safe-area-inset-top,0px));max-height:calc(100vh - 108px);overflow:auto}
.brand{font-weight:800;font-size:1.15rem;margin:4px 6px 14px}.brand span{background:var(--yellow);color:var(--navy);padding:0 8px;border-radius:6px;margin-left:2px}
.topbar{background:#fff;border-bottom:1.5px solid var(--line);padding:8px 24px;position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
.logo{display:block;max-width:1240px;margin:0 auto}
.logo img{display:block;height:56px;width:auto}
.pf{background:var(--navy2);border-radius:16px;padding:18px;text-align:center}
.ava{width:84px;height:84px;border-radius:50%;background:var(--yellow);color:var(--navy);display:grid;place-items:center;font-size:2rem;font-weight:800;margin:0 auto 10px;border:3px solid var(--cream)}
.pf h2{margin:0;font-size:1.15rem}
.pf .hl{color:#c9cde0;font-size:.85rem;margin:2px 0 8px}
.ver{display:inline-block;background:#d9f0e3;color:var(--ok);font-size:.76rem;font-weight:700;padding:2px 10px;border-radius:99px}
.mini{list-style:none;margin:12px 0 0;padding:0;text-align:left;font-size:.86rem}
.mini li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid #3d4870}
.mini span:first-child{color:#aab1cc}.mini span:last-child{font-weight:600;text-align:right}
.pf .b{width:100%;margin-top:12px}
.nav{margin:16px 0 4px;display:grid;gap:6px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border:0;border-radius:12px;background:transparent;color:var(--cream);font-weight:600;cursor:pointer}
.nav button:hover{background:var(--navy2)}
.nav button[aria-current=page]{background:var(--yellow);color:var(--navy)}
.nav .n{margin-left:auto;background:var(--yellow);color:var(--navy);font-size:.75rem;font-weight:800;border-radius:99px;padding:1px 8px}
.nav button[aria-current=page] .n{background:var(--navy);color:var(--yellow)}
main{min-width:0}
.coinbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px 20px;margin-bottom:22px}
.coinbar small{color:var(--muted);letter-spacing:.04em;font-size:.78rem}
.coinbar b{display:block;font-size:1.7rem;line-height:1.1}
.coinbar .r{display:flex;align-items:center;gap:14px}
.link{background:none;border:0;font-weight:600;cursor:pointer;text-decoration:underline;padding:4px}
h1{font-size:1.8rem;letter-spacing:-.02em;margin:0 0 2px;font-weight:800}
.sub{color:var(--muted);margin:0 0 20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}
.stat{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px;text-align:center}
.stat span{color:var(--muted);font-size:.86rem;font-weight:600}
.stat b{display:block;font-size:1.8rem;line-height:1.2;font-weight:800;margin-top:6px}
.stat.hi{background:var(--yellow);border-color:var(--yellow)}.stat.hi span{color:var(--navy)}
.stat .v{font-size:1.1rem;margin-top:10px}
.prog{margin-bottom:24px}
.prog p{margin:0 0 8px;font-size:1.05rem}
.prog div{height:12px;background:#ecdfc6;border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--navy);border-radius:99px}
.box{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:20px;margin-bottom:22px}
.box h2{font-size:1.15rem;margin:0}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tab{padding:6px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);font-weight:600;cursor:pointer;font-size:.88rem;color:var(--muted)}
.tab[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:var(--cream)}
input[type=search]{padding:8px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--cream);min-width:190px}
.lead{border:1.5px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;display:grid;grid-template-columns:1fr auto;gap:12px}
.lead h3{margin:0;font-size:1.05rem}
.meta{color:var(--muted);font-size:.88rem;margin:2px 0 8px}
.tags span{display:inline-block;background:var(--cream);border:1px solid var(--line);font-size:.8rem;font-weight:600;padding:2px 10px;border-radius:99px;margin:2px 4px 2px 0}
.note{font-size:.9rem;margin:6px 0 0}
.lock{font-size:.88rem;color:var(--muted);margin:6px 0 0}
.contact{font-size:.92rem;font-weight:600;margin:6px 0 0}
.badge{display:inline-block;font-size:.76rem;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--yellow)}
.badge.accepted{background:#d9f0e3;color:var(--ok)}.badge.declined{background:#f7dcda;color:var(--bad)}.badge.demo{background:#dfe5fb;color:#27407f}.badge.locked{background:#ecdfc6}
.acts{display:flex;flex-direction:column;gap:8px;align-items:flex-end;justify-content:center}
.b{padding:9px 16px;border-radius:10px;border:2px solid var(--navy);background:var(--navy);color:var(--cream);font-weight:600;cursor:pointer;font-size:.9rem;white-space:nowrap}
.b:hover{background:var(--navy2)}
.b.y{background:var(--yellow);border-color:var(--yellow);color:var(--navy)}.b.y:hover{background:#ffc965}
.b.o{background:transparent;color:var(--navy)}.b.o:hover{background:var(--cream)}
.empty{color:var(--muted);text-align:center;padding:24px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:22px}.two .box{margin-bottom:0}
.row{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);align-items:center}.row:last-child{border:0}
.when{background:var(--navy);color:var(--cream);border-radius:10px;text-align:center;padding:6px 10px;min-width:58px;font-size:.8rem;line-height:1.2}.when b{display:block;font-size:1.15rem;color:var(--yellow)}
.row p{margin:0}.row small{color:var(--muted)}
.row .amt{margin-left:auto;font-weight:800}.amt.pos{color:var(--ok)}.amt.neg{color:var(--bad)}
.kv{margin:0;padding:0;list-style:none}.kv li{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-top:1px solid var(--line)}.kv li span:first-child{color:var(--muted)}.kv li span:last-child{font-weight:600;text-align:right}
.packs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:8px}
.pack{border:1.5px solid var(--line);border-radius:14px;padding:16px;text-align:center;background:var(--cream);cursor:pointer;font-weight:600}
.pack:hover{border-color:var(--navy);background:var(--yellow)}
.pack b{display:block;font-size:1.6rem}.pack small{display:block;color:var(--muted);font-weight:400}.pack:hover small{color:var(--navy)}
.set{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.set input{width:22px;height:22px;accent-color:var(--navy)}
dialog{border:0;border-radius:18px;padding:24px;max-width:480px;width:calc(100% - 32px);background:var(--cream);color:var(--navy)}
dialog::backdrop{background:rgba(26,32,53,.6)}
dialog h2{margin:0 0 4px}
.ask{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--yellow);color:var(--navy);border:2px solid var(--navy);border-radius:99px;padding:12px 20px;font-weight:800;cursor:pointer;box-shadow:0 6px 18px rgba(26,32,53,.25)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:var(--cream);padding:11px 18px;border-radius:8px;font-size:.9rem;max-width:90vw;z-index:20}
.hide{display:none}
.tutor-top-nav{display:flex;gap:14px;align-items:center;font-size:.88rem;font-weight:600}
.tutor-top-nav a{color:var(--navy);text-decoration:none;transition:color .15s}
.tutor-top-nav a:hover{color:var(--ok)}
@media(max-width:960px){.app{grid-template-columns:1fr}.side{position:static;max-height:none}.two{grid-template-columns:1fr}.nav{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}}
@media(max-width:760px){.tutor-top-nav{display:none}}
@media(max-width:560px){.lead{grid-template-columns:1fr}.acts{flex-direction:row;align-items:center;justify-content:flex-start;flex-wrap:wrap}.ask{bottom:calc(76px + env(safe-area-inset-bottom,0px))}}
</style>
<script>
(function(){
  try {
    var u = JSON.parse(localStorage.getItem('modivs_auth_user') || 'null');
    var admin = JSON.parse(localStorage.getItem('modivs_admin_session') || 'null');
    var isTutor = (u && u.role === 'Tutor');
    var isAdmin = (admin && admin.email === 'admin@gmail.com');
    if(!isTutor && !isAdmin){
      window.location.replace('modivs-education.html#tutor-login');
    }
  } catch(e){}
})();
</script>
</head>

(function initTutorProfile(){

  } catch(e){}

  var allTutors = [];
  try {

  } catch(e){}

  var tutor = allTutors.find(function(t){ return t.email === email; });
  if(!tutor){
    try {
      tutor = JSON.parse(localStorage.getItem('modivs_current_tutor') || 'null');
    } catch(e){}
  }
  if(!tutor){
    tutor = {
