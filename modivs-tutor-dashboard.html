<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Modiv’s Education – Tutor dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#1A2035;--navy2:#2a3350;--yellow:#FABD4E;--cream:#FEF7EA;--card:#fff;--muted:#555b78;--line:#eadfc9;--ok:#1d7a4d;--bad:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--cream);color:var(--navy);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
button,input,select{font:inherit;color:inherit}
:is(a,button,input,select,summary):focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.app{display:grid;grid-template-columns:290px 1fr;gap:24px;max-width:1280px;margin:0 auto;padding:20px 20px 80px;align-items:start}
.side{background:var(--navy);color:var(--cream);border-radius:22px;padding:18px;position:sticky;top:calc(88px + env(safe-area-inset-top,0px));max-height:calc(100vh - 108px);overflow:auto}
.brand{font-weight:800;font-size:1.15rem;margin:4px 6px 14px}.brand span{background:var(--yellow);color:var(--navy);padding:0 8px;border-radius:6px;margin-left:2px}
.topbar{background:#fff;border-bottom:1.5px solid var(--line);padding:8px 24px;position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
.logo{display:block;max-width:1240px;margin:0 auto}
.logo img{display:block;height:56px;width:auto}
.pf{background:var(--navy2);border-radius:16px;padding:18px;text-align:center}
.ava img{width:100%;height:100%;object-fit:cover;display:block}
.ava{overflow:hidden;width:84px;height:84px;border-radius:50%;background:var(--yellow);color:var(--navy);display:grid;place-items:center;font-size:2rem;font-weight:800;margin:0 auto 10px;border:3px solid var(--cream)}
.pf h2{margin:0;font-size:1.15rem}
.pf .hl{color:#c9cde0;font-size:.85rem;margin:2px 0 8px}
.ver{display:inline-block;background:#d9f0e3;color:var(--ok);font-size:.76rem;font-weight:700;padding:2px 10px;border-radius:99px}
.mini{list-style:none;margin:12px 0 0;padding:0;text-align:left;font-size:.86rem}
.mini li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid #3d4870}
.mini span:first-child{color:#aab1cc}.mini span:last-child{font-weight:600;text-align:right}
.pf .b{width:100%;margin-top:12px}
.nav{margin:16px 0 4px;display:grid;gap:6px}
.nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border:0;border-radius:12px;background:transparent;color:var(--cream);font-weight:600;cursor:pointer}
.nav button:hover{background:var(--navy2)}
.nav button[aria-current=page]{background:var(--yellow);color:var(--navy)}
.nav .n{margin-left:auto;background:var(--yellow);color:var(--navy);font-size:.75rem;font-weight:800;border-radius:99px;padding:1px 8px}
.nav button[aria-current=page] .n{background:var(--navy);color:var(--yellow)}
main{min-width:0}
.coinbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px 20px;margin-bottom:22px}
.coinbar small{color:var(--muted);letter-spacing:.04em;font-size:.78rem}
.coinbar b{display:block;font-size:1.7rem;line-height:1.1}
.coinbar .r{display:flex;align-items:center;gap:14px}
.link{background:none;border:0;font-weight:600;cursor:pointer;text-decoration:underline;padding:4px}
h1{font-size:1.8rem;letter-spacing:-.02em;margin:0 0 2px;font-weight:800}
.sub{color:var(--muted);margin:0 0 20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}
.stat{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px;text-align:center}
.stat span{color:var(--muted);font-size:.86rem;font-weight:600}
.stat b{display:block;font-size:1.8rem;line-height:1.2;font-weight:800;margin-top:6px}
.stat.hi{background:var(--yellow);border-color:var(--yellow)}.stat.hi span{color:var(--navy)}
.stat .v{font-size:1.1rem;margin-top:10px}
.prog{margin-bottom:24px}
.prog p{margin:0 0 8px;font-size:1.05rem}
.prog div{height:12px;background:#ecdfc6;border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--navy);border-radius:99px}
.box{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:20px;margin-bottom:22px}
.box h2{font-size:1.15rem;margin:0}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tab{padding:6px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);font-weight:600;cursor:pointer;font-size:.88rem;color:var(--muted)}
.tab[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:var(--cream)}
input[type=search]{padding:8px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--cream);min-width:190px}
.lead{border:1.5px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;display:grid;grid-template-columns:1fr auto;gap:12px}
.lead h3{margin:0;font-size:1.05rem}
.meta{color:var(--muted);font-size:.88rem;margin:2px 0 8px}
.tags span{display:inline-block;background:var(--cream);border:1px solid var(--line);font-size:.8rem;font-weight:600;padding:2px 10px;border-radius:99px;margin:2px 4px 2px 0}
.note{font-size:.9rem;margin:6px 0 0}
.lock{font-size:.88rem;color:var(--muted);margin:6px 0 0}
.contact{font-size:.92rem;font-weight:600;margin:6px 0 0}
.badge{display:inline-block;font-size:.76rem;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--yellow)}
.badge.accepted{background:#d9f0e3;color:var(--ok)}.badge.declined{background:#f7dcda;color:var(--bad)}.badge.demo{background:#dfe5fb;color:#27407f}.badge.locked{background:#ecdfc6}
.acts{display:flex;flex-direction:column;gap:8px;align-items:flex-end;justify-content:center}
.b{padding:9px 16px;border-radius:10px;border:2px solid var(--navy);background:var(--navy);color:var(--cream);font-weight:600;cursor:pointer;font-size:.9rem;white-space:nowrap}
.b:hover{background:var(--navy2)}
.b.y{background:var(--yellow);border-color:var(--yellow);color:var(--navy)}.b.y:hover{background:#ffc965}
.b.o{background:transparent;color:var(--navy)}.b.o:hover{background:var(--cream)}
.empty{color:var(--muted);text-align:center;padding:24px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:22px}.two .box{margin-bottom:0}
.row{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);align-items:center}.row:last-child{border:0}
.when{background:var(--navy);color:var(--cream);border-radius:10px;text-align:center;padding:6px 10px;min-width:58px;font-size:.8rem;line-height:1.2}.when b{display:block;font-size:1.15rem;color:var(--yellow)}
.row p{margin:0}.row small{color:var(--muted)}
.row .amt{margin-left:auto;font-weight:800}.amt.pos{color:var(--ok)}.amt.neg{color:var(--bad)}
.kv{margin:0;padding:0;list-style:none}.kv li{display:flex;justify-content:space-between;gap:14px;padding:10px 0;border-top:1px solid var(--line)}.kv li span:first-child{color:var(--muted)}.kv li span:last-child{font-weight:600;text-align:right}
.packs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:8px}
.pack{border:1.5px solid var(--line);border-radius:14px;padding:16px;text-align:center;background:var(--cream);cursor:pointer;font-weight:600}
.pack:hover{border-color:var(--navy);background:var(--yellow)}
.pack b{display:block;font-size:1.6rem}.pack small{display:block;color:var(--muted);font-weight:400}.pack:hover small{color:var(--navy)}
.set{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-top:1px solid var(--line)}
.set input{width:22px;height:22px;accent-color:var(--navy)}
dialog{border:0;border-radius:18px;padding:24px;max-width:480px;width:calc(100% - 32px);background:var(--cream);color:var(--navy)}
dialog::backdrop{background:rgba(26,32,53,.6)}
dialog h2{margin:0 0 4px}
.ask{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--yellow);color:var(--navy);border:2px solid var(--navy);border-radius:99px;padding:12px 20px;font-weight:800;cursor:pointer;box-shadow:0 6px 18px rgba(26,32,53,.25)}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:var(--cream);padding:11px 18px;border-radius:8px;font-size:.9rem;max-width:90vw;z-index:20}
.hide{display:none}
.tutor-top-nav{display:flex;gap:14px;align-items:center;font-size:.88rem;font-weight:600}
.tutor-top-nav a{color:var(--navy);text-decoration:none;transition:color .15s}
.tutor-top-nav a:hover{color:var(--ok)}
@media(max-width:960px){.app{grid-template-columns:1fr}.side{position:static;max-height:none}.two{grid-template-columns:1fr}.nav{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}}
@media(max-width:760px){.tutor-top-nav{display:none}}
@media(max-width:560px){.lead{grid-template-columns:1fr}.acts{flex-direction:row;align-items:center;justify-content:flex-start;flex-wrap:wrap}.ask{bottom:calc(76px + env(safe-area-inset-bottom,0px))}}
</style>
<script>
(function(){
  try {
    var u = JSON.parse(localStorage.getItem('modivs_auth_user') || 'null');
    var admin = JSON.parse(localStorage.getItem('modivs_admin_session') || 'null');
    var isTutor = (u && u.role === 'Tutor');
    var isAdmin = (admin && admin.email === 'admin@gmail.com');
    if(!isTutor && !isAdmin){
      window.location.replace('modivs-education.html#tutor-login');
    }
  } catch(e){}
})();
</script>
</head>

</dialog>

<script>
(function(){
var $=function(id){return document.getElementById(id)};
var state={view:'dash',coins:20,filter:'new',q:'',tT:null};
var COST=10;
var leads=[
 {id:1,name:'Aarav Mehta',who:'Parent: Sunita Mehta',phone:'98xxxxxx11',cls:'Class 10',board:'CBSE',city:'Ludhiana',subs:['Mathematics'],mode:'Online',budget:'₹500–700',when:'Mon, Wed, Fri evening',note:'Needs help with trigonometry before pre-boards.',time:'2 hours ago',status:'new',unlocked:false},
 {id:2,name:'Simran Kaur',who:'Student',phone:'97xxxxxx22',cls:'Class 12',board:'PSEB',city:'Ludhiana',subs:['Mathematics','Physics'],mode:'Home',budget:'₹600–800',when:'Weekend morning',note:'Wants a demo class first.',time:'Yesterday',status:'new',unlocked:false},
 {id:6,name:'Harleen Dhillon',who:'Parent: Jaspal Dhillon',phone:'99xxxxxx33',cls:'Class 8',board:'CBSE',city:'Ludhiana',subs:['Mathematics'],mode:'Home',budget:'₹400–500',when:'Daily evening',note:'Weak in fractions and geometry.',time:'Yesterday',status:'new',unlocked:false},
 {id:7,name:'Vikram Arora',who:'Student',phone:'96xxxxxx44',cls:'Class 11',board:'ICSE',city:'Ludhiana',subs:['Physics'],mode:'Online',budget:'₹700–900',when:'Tue, Thu evening',note:'JEE foundation.',time:'2 days ago',status:'new',unlocked:false},
 {id:3,name:'Rohan Gill',who:'Parent: Harpreet Gill',phone:'98xxxxxx55',cls:'Class 9',board:'CBSE',city:'Ludhiana',subs:['Mathematics'],mode:'Online',budget:'₹400–600',when:'Tue, Thu evening',note:'Struggling with algebra basics.',time:'2 days ago',status:'demo',unlocked:true},
 {id:4,name:'Ananya Verma',who:'Parent: Neha Verma',phone:'97xxxxxx66',cls:'Class 11',board:'ICSE',city:'Ludhiana',subs:['Physics'],mode:'Online',budget:'₹700–900',when:'Daily afternoon',note:'JEE foundation, 5 classes a week.',time:'3 days ago',status:'accepted',unlocked:true},
 {id:5,name:'Kabir Singh',who:'Student',phone:'96xxxxxx77',cls:'College',board:'Other',city:'Ludhiana',subs:['Mathematics'],mode:'At tutor’s place',budget:'₹300–400',when:'Sunday',note:'Budget is below your fee.',time:'4 days ago',status:'declined',unlocked:true}
];
var hist=[{t:'Joined bonus',d:'Oct 20',a:30},{t:'Unlocked Ananya Verma',d:'Oct 24',a:-10}];
var classes=[['28','Oct','Ananya Verma','Physics · 5:00 PM · Online'],['29','Oct','Rohan Gill','Demo class · 6:00 PM · Online'],['31','Oct','Simran Kaur','Mathematics · 10:00 AM · Home']];
var PACKS=[[50,'₹500'],[120,'₹1,000'],[300,'₹2,000']];
var LABEL={new:'New',demo:'Demo scheduled',accepted:'Accepted',declined:'Declined'};
var PROFILE_PCT=86,VERIFIED=true;

function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function toast(t){var e=$('toast');e.textContent=t;e.classList.remove('hide');clearTimeout(state.tT);state.tT=setTimeout(function(){e.classList.add('hide')},2600)}
function n(s){return leads.filter(function(l){return l.status===s}).length}
function newLeads(){return leads.filter(function(l){return !l.unlocked&&l.status==='new'})}
function unlockedCount(){return leads.filter(function(l){return l.unlocked}).length}

function openRecharge(){$('dlg').showModal()}
function recharge(c,price){state.coins+=c;hist.unshift({t:'Recharged '+c+' coins ('+price+')',d:'Today',a:c});$('dlg').close();toast(c+' coins added.');render()}
function unlock(l){
 if(state.coins<COST){toast('Not enough coins. Recharge to unlock this lead.');openRecharge();return}
 state.coins-=COST;l.unlocked=true;hist.unshift({t:'Unlocked '+l.name,d:'Today',a:-COST});toast('Unlocked '+l.name+'. Contact details are now visible.');render()
}

function nav(){
 var N=[['dash','🏠','My Dashboard'],['profile','👤','My Profile'],['leads','🎯','New Leads',newLeads().length],['credits','🪙','My Credits'],['settings','⚙️','Settings']];
 var b=$('nav');b.innerHTML='';
 N.forEach(function(x){var btn=el('button');btn.type='button';var i=el('span',null,x[1]);i.setAttribute('aria-hidden','true');btn.appendChild(i);btn.appendChild(el('span',null,x[2]));
  if(x[3]){btn.appendChild(el('span','n',x[3]))}
  if(state.view===x[0])btn.setAttribute('aria-current','page');
  btn.addEventListener('click',function(){state.view=x[0];render();window.scrollTo(0,0)});b.appendChild(btn)})
}

function stat(label,val,cls,small){var d=el('div','stat'+(cls?' '+cls:''));d.appendChild(el('span','',label));d.appendChild(el('b',small?'v':'',val));return d}

function leadCard(l){
 var c=el('div','lead'),L=el('div'),A=el('div','acts');
 var title=l.unlocked?l.name:l.name.split(' ')[0]+' '+l.name.split(' ')[1].charAt(0)+'.';
 var h=el('h3','',title+' ');h.appendChild(el('span','badge '+(l.unlocked?l.status:'locked'),l.unlocked?LABEL[l.status]:'Locked'));L.appendChild(h);
 L.appendChild(el('p','meta',(l.unlocked?l.who+' · ':'')+l.cls+' · '+l.board+' · '+l.city+' · '+l.time));
 var t=el('div','tags');l.subs.concat([l.mode,'Budget '+l.budget,l.when]).forEach(function(x){t.appendChild(el('span','',x))});L.appendChild(t);
 if(l.unlocked){L.appendChild(el('p','note',l.note));L.appendChild(el('p','contact','Contact: '+l.phone))}
 else L.appendChild(el('p','lock','Unlock to see the full name, contact number and notes.'));
 function btn(x,cls,fn){var b=el('button','b '+cls,x);b.type='button';b.addEventListener('click',fn);A.appendChild(b)}
 function set(s,m){l.status=s;toast(m);render()}
 if(!l.unlocked)btn('Unlock · '+COST+' coins','y',function(){unlock(l)});
 else if(l.status==='new'){btn('Accept','y',function(){set('accepted','Accepted '+l.name+'.')});btn('Offer demo','',function(){set('demo','Demo offered to '+l.name+'.')});btn('Decline','o',function(){set('declined','Declined '+l.name+'.')})}
 else if(l.status==='demo'){btn('Accept','y',function(){set('accepted','Accepted '+l.name+'.')});btn('Decline','o',function(){set('declined','Declined '+l.name+'.')})}
 else btn('Message','o',function(){toast('Messaging opens here once chat is built.')});
 c.appendChild(L);c.appendChild(A);return c
}

function vDash(v){
 v.appendChild(el('h1','','My Dashboard'));v.appendChild(el('p','sub','Your leads, coins and profile at a glance.'));
 var s=el('div','stats');
 s.appendChild(stat('Available Coins',state.coins,'hi'));s.appendChild(stat('New Leads',newLeads().length));s.appendChild(stat('Unlocked Leads',unlockedCount()));
 s.appendChild(stat('Verification',VERIFIED?'Verified ✓':'Create Profile','',1));v.appendChild(s);
 var p=el('div','prog');p.appendChild(el('p','','Profile Completion: '+PROFILE_PCT+'%'));var d=el('div');var i=el('i');i.style.width=PROFILE_PCT+'%';d.appendChild(i);p.appendChild(d);v.appendChild(p);
 var box=el('section','box');var hd=el('div','head');hd.appendChild(el('h2','','Latest new leads'));var all=el('button','link','See all leads');all.type='button';all.addEventListener('click',function(){state.view='leads';render()});hd.appendChild(all);box.appendChild(hd);
 var nl=newLeads().slice(0,2);if(!nl.length)box.appendChild(el('p','empty','No new leads right now.'));nl.forEach(function(l){box.appendChild(leadCard(l))});v.appendChild(box);
 var two=el('div','two'),a=el('section','box');a.appendChild(el('h2','','Upcoming classes'));
 classes.forEach(function(x){var r=el('div','row'),w=el('div','when');w.appendChild(el('b','',x[0]));w.appendChild(document.createTextNode(x[1]));var q=el('div');q.appendChild(el('p','',x[2]));q.appendChild(el('small','',x[3]));r.appendChild(w);r.appendChild(q);a.appendChild(r)});
 var b=el('section','box');b.appendChild(el('h2','','Recent activity'));
 ['Aarav Mehta sent you a tutoring request','New 5-star review from Ananya’s parent','Your profile was viewed 14 times this week','Verification approved by Modiv’s team'].forEach(function(x){var r=el('div','row');r.appendChild(el('p','',x));b.appendChild(r)});
 two.appendChild(a);two.appendChild(b);v.appendChild(two)
}
function vLeads(v){
 v.appendChild(el('h1','','New Leads'));v.appendChild(el('p','sub','Unlock a lead for '+COST+' coins to see contact details.'));
 var box=el('section','box'),hd=el('div','head');hd.appendChild(el('h2','','Student leads'));
 var q=document.createElement('input');q.type='search';q.placeholder='Search name or subject';q.setAttribute('aria-label','Search leads');q.value=state.q;
 hd.appendChild(q);box.appendChild(hd);
 var tb=el('div','tools');tb.style.marginBottom='14px';
 [['new','New ('+newLeads().length+')'],['unlocked','Unlocked ('+unlockedCount()+')'],['all','All ('+leads.length+')']].forEach(function(x){var b=el('button','tab',x[1]);b.type='button';b.setAttribute('aria-pressed',state.filter===x[0]);b.addEventListener('click',function(){state.filter=x[0];render()});tb.appendChild(b)});
 box.appendChild(tb);var list=el('div');box.appendChild(list);v.appendChild(box);
 function fill(){list.innerHTML='';var s=state.q.toLowerCase();

// Application status and tutor profile resolution
(function initTutorProfile(){
  var authUser = null;
  try {
    authUser = JSON.parse(localStorage.getItem('modivs_auth_user') || 'null');
  } catch(e){}

  var email = (authUser && authUser.role === 'Tutor') ? authUser.email : 'priya@example.com';
  var allTutors = [];
  try {
    allTutors = JSON.parse(localStorage.getItem('modivs_tutors_db') || '[]');
  } catch(e){}

  var tutor = allTutors.find(function(t){ return t.email === email; });
  if(!tutor){
    try {
      tutor = JSON.parse(localStorage.getItem('modivs_current_tutor') || 'null');
    } catch(e){}
  }
  if(!tutor){
    tutor = {
      name: 'Priya Sharma',
      headline: 'Maths tutor · 8 years’ experience',
      city: 'Ludhiana',
      fee: 600,
      status: 'approved'
    };
  }

  window.MY_TUTOR = tutor;
  function escH(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

  // Update sidebar card
  var wEl = $('tutorWelcome'), hEl = $('tutorHeadline'), cEl = $('tutorCity'), fEl = $('tutorFee'), aEl = $('tutorAva'), pEl = $('verPill');
  if(wEl) wEl.textContent = 'Welcome, ' + tutor.name.split(' ')[0];
  if(hEl) hEl.textContent = tutor.headline || 'Verified Tutor';
  if(cEl) cEl.textContent = tutor.city || 'Ludhiana';
  if(fEl) fEl.textContent = '₹' + (tutor.fee || 600) + ' / hour';
  if(aEl && tutor.photo){
    aEl.textContent = '';
    var pim = document.createElement('img');
    pim.src = tutor.photo;
    pim.alt = tutor.name + ' profile photo';
    aEl.appendChild(pim);
  } else if(aEl){
    var inits = tutor.name.split(' ').map(function(w){return w[0]}).slice(0,2).join('').toUpperCase();
    aEl.textContent = inits || 'TR';
  }

  // Render status banner and pill
  var b = $('statusBanner');
  if(b){
    if(tutor.status === 'pending'){
      if(pEl){ pEl.textContent = 'Pending Approval'; pEl.style.background = '#ecdfc6'; pEl.style.color = 'var(--navy)'; }
      b.innerHTML = '<div style="background:#fff9e6;border:1.5px solid var(--yellow);border-radius:14px;padding:16px 20px;margin-bottom:22px;display:flex;align-items:center;gap:14px;">' +
        '<span style="font-size:1.8rem;" aria-hidden="true">⏳</span>' +
        '<div>' +
          '<h3 style="margin:0;font-size:1.05rem;color:var(--navy);">Your profile is awaiting admin approval.</h3>' +
          '<p style="margin:4px 0 0;font-size:0.88rem;color:var(--muted);">Our admin team is currently reviewing your submitted qualifications, ID documents, and experience. Your profile is not publicly visible and will be published to tutor search once approved.</p>' +
        '</div>' +
      '</div>';
    } else if(tutor.status === 'rejected'){
      if(pEl){ pEl.textContent = 'Changes Needed'; pEl.style.background = '#f7dcda'; pEl.style.color = 'var(--bad)'; }
      var rs = tutor.rejection_reasons || [];
      var feedbackHtml = '';
      if(rs.length){
        feedbackHtml = '<strong>Please fix the following:</strong><ul style="margin:6px 0 0;padding-left:20px;">' + rs.map(function(r){ return '<li><strong>' + escH(r.label) + '</strong> &mdash; ' + escH(r.fix) + '</li>'; }).join('') + '</ul>' + (tutor.rejection_note ? '<div style="margin-top:8px;"><strong>Note from admin:</strong> ' + escH(tutor.rejection_note) + '</div>' : '');
      } else {
        feedbackHtml = '<strong>Admin Feedback:</strong> ' + escH(tutor.rejection_reason || 'Please review your uploaded certificates and ensure contact details match.');
      }
      b.innerHTML = '<div style="background:#fdf2f2;border:1.5px solid var(--bad);border-radius:14px;padding:16px 20px;margin-bottom:22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;">' +
        '<span style="font-size:1.8rem;" aria-hidden="true">⚠️</span>' +
        '<div style="flex:1;min-width:260px;">' +
          '<h3 style="margin:0;font-size:1.05rem;color:var(--bad);">Your application needs changes. Please review the admin feedback and resubmit.</h3>' +
          '<p style="margin:6px 0 0;font-size:0.9rem;color:var(--navy);background:#fff;padding:8px 12px;border-radius:8px;border:1px dashed var(--bad);">' + feedbackHtml + '</p>' +
        '</div>' +
        '<a href="modivs-tutor-edit-profile.html" class="b y" style="text-decoration:none;font-size:0.9rem;">Edit &amp; Resubmit Application &rarr;</a>' +
      '</div>';
    } else {
      // Approved
      if(pEl){ pEl.textContent = 'Approved & Published'; pEl.style.background = '#d9f0e3'; pEl.style.color = 'var(--ok)'; }
      b.innerHTML = '<div style="background:#eef8f2;border:1.5px solid var(--ok);border-radius:14px;padding:16px 20px;margin-bottom:22px;display:flex;align-items:center;gap:14px;">' +
        '<span style="font-size:1.8rem;" aria-hidden="true">✅</span>' +
        '<div>' +
          '<h3 style="margin:0;font-size:1.05rem;color:var(--ok);">Your profile is approved and published.</h3>' +
          '<p style="margin:4px 0 0;font-size:0.88rem;color:var(--muted);">Your profile is active and publicly visible! Students and parents can discover you in tutor search results and send tuition requests.</p>' +
        '</div>' +
      '</div>';
    }
  }
})();
