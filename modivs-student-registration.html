<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Modiv’s Education – Student / Parent registration</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js" defer></script>
<script src="firebase-config.js" defer></script>
<script src="firebase-sync.js" defer></script>
<style>
:root{--white:#fff;--mist:#f2f5f9;--line:#dfe5ee;--ink:#14213d;--muted:#5d6b82;--accent:#0e7c66;--accent-d:#0a5f4e;--tint:#e8f5f1;--err:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--white);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
.brand{font-weight:800;font-size:1.2rem;letter-spacing:-.01em;display:inline-flex;align-items:center;text-decoration:none}.brand img{height:44px;width:auto;display:block}.brand span{color:var(--accent)}
.shell{display:grid;grid-template-columns:70fr 30fr;min-height:100vh}
.main{padding:36px 28px 60px;display:flex;justify-content:center}
.col{width:100%;max-width:640px}
.topl{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.topl .links{display:flex;gap:8px;align-items:center}.topl .links a{color:var(--ink);text-decoration:none;font-weight:600;font-size:.88rem;border:1.5px solid var(--line);padding:6px 12px;border-radius:8px;background:#fff}.topl .links a:hover{border-color:var(--ink)}
.side{background:var(--ink);color:#fff;padding:36px 26px}
.side h2{font-size:1rem;margin:28px 0 14px;font-weight:600;color:#aab6cc}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:12px;align-items:center;padding:9px 0;color:#aab6cc;font-size:.95rem}
.steps i{width:26px;height:26px;border-radius:50%;border:1.5px solid #4a5a7a;display:grid;place-items:center;font-style:normal;font-size:.8rem;flex:none}
.steps li.on{color:#fff;font-weight:600}.steps li.on i{background:var(--accent);border-color:var(--accent)}
.steps li.done i{background:#fff;color:var(--ink);border-color:#fff}
.bar{height:6px;background:var(--mist);border-radius:99px;margin:18px 0 28px;overflow:hidden}
.bar div{height:100%;background:var(--accent);width:0}
h1{font-size:1.85rem;line-height:1.15;margin:0 0 6px;letter-spacing:-.02em;font-weight:800}
.sub{color:var(--muted);margin:0 0 20px}
label,.lab{display:block;font-weight:600;font-size:.9rem;margin:18px 0 6px}
.hint{font-weight:400;color:var(--muted);font-size:.82rem}
input[type=text],input[type=email],input[type=password],input[type=tel],input[type=number],input[type=date],select,textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:8px;background:var(--white)}
textarea{min-height:100px;resize:vertical}
:is(input,select,textarea,button):focus-visible{outline:3px solid #7fd1bd;outline-offset:2px}
.bad{border-color:var(--err)!important}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;margin:0!important;font-weight:400!important}.chip input{position:absolute;opacity:0}
.chip span{display:block;padding:8px 14px;border:1.5px solid var(--line);border-radius:999px;cursor:pointer;font-size:.92rem}
.chip input:checked+span{background:var(--tint);border-color:var(--accent);font-weight:600}
.chip input:focus-visible+span{outline:3px solid #7fd1bd;outline-offset:2px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.roles .chip span{border-radius:10px;padding:14px;text-align:center;font-weight:600}
.roles .chip small{display:block;font-weight:400;color:var(--muted)}
.card{background:var(--mist);border-radius:12px;padding:16px;margin:12px 0;position:relative}
.card .rm{position:absolute;top:10px;right:10px;border:0;background:none;color:var(--muted);cursor:pointer;font-weight:600}
.add{border:1.5px dashed var(--accent);background:var(--white);color:var(--accent-d);font-weight:600;border-radius:8px;padding:10px 14px;cursor:pointer;margin-top:6px}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:32px}
.btn{padding:12px 22px;border-radius:8px;border:0;font-weight:600;cursor:pointer;background:var(--accent);color:#fff}
.btn:hover{background:var(--accent-d)}
.btn.ghost{background:var(--white);border:1.5px solid var(--line);color:var(--ink)}.btn.ghost:hover{background:var(--mist)}
.msg{color:var(--err);font-size:.88rem;min-height:1.3em;margin-top:14px}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:18px;font-weight:400}
.check input{margin-top:4px;accent-color:var(--accent)}
.prev{border:1px solid var(--line);border-radius:14px;padding:22px;margin-top:8px}
.prev h3{margin:0;font-size:1.3rem}.prev p{margin:6px 0}
.tag{display:inline-block;background:var(--tint);color:var(--accent-d);font-size:.82rem;font-weight:600;padding:3px 10px;border-radius:99px;margin:2px 4px 2px 0}
.status{display:inline-block;background:var(--tint);color:var(--accent-d);font-weight:600;font-size:.85rem;padding:4px 12px;border-radius:99px}
.done-box{text-align:center;padding:40px 0}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:8px;font-size:.9rem}
@media(max-width:820px){.shell{grid-template-columns:1fr}.side{display:none}.main{padding:24px 16px 60px}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="shell">
 <main class="main"><div class="col">
  <div class="topl"><a href="modivs-home.html" class="brand"><img src="logo.png" alt="Modiv’s Education"></a><div class="links" id="topLinks"><a href="modivs-home.html">Home</a></div></div>
  <div class="bar" aria-hidden="true"><div id="fill"></div></div>
  <form id="form" novalidate></form>
 </div></main>
 <aside class="side">
  <div class="brand">Find a tutor</div>
  <h2>Your progress</h2>
  <ol class="steps" id="steps"></ol>
 </aside>
</div>
<div class="toast hide" id="toast" role="status"></div>

<script>
(function(){
var STEPS=['Create account','Student details','Learning needs','Tutor preferences','Review & submit'];
var SUBJECTS=['Mathematics','Physics','Chemistry','Biology','English','Hindi','Punjabi','Computer Science','Accountancy','Economics','Social Science','Music','Art'];
var CLASSES=['Nursery–KG','Class 1','Class 2','Class 3','Class 4','Class 5','Class 6','Class 7','Class 8','Class 9','Class 10','Class 11','Class 12','College / University','Adult learner'];
var BOARDS=['CBSE','ICSE','PSEB','IB','IGCSE','State board','Other'];
var GOALS=['Improve school grades','Board exam preparation','Competitive exam (JEE, NEET, etc.)','Homework help','Build concepts from basics','Learn a new skill'];
var LANGS=['English','Hindi','Punjabi','Urdu','Other'];
var DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
var TIMES=['Morning','Afternoon','Evening'];
var D={role:'Parent',email:'',pass:'',regName:'',phone:'',city:'',
 stuName:'',stuAge:'',cls:'',board:'',school:'',
 subjects:[],level:'',goals:[],weak:'',notes:'',
 modes:['Online'],formats:['1-on-1 Individual tuition'],area:'',budgetMin:'',budgetMax:'',freq:'',days:[],times:[],start:'',tGender:'',langs:[],demo:'',agree:false};

/* ---- logged-in students: update the saved requirement instead of signing up again ---- */
var AU=null;try{AU=JSON.parse(localStorage.getItem('modivs_auth_user')||'null')}catch(e){}
var EDIT=!!(AU&&AU.role==='Student / Parent'&&AU.email);
var SAVED_ID='',SAVED_STATUS='';
function jget(k,d){try{var v=JSON.parse(localStorage.getItem(k)||'null');return v==null?d:v}catch(e){return d}}
if(EDIT){
 var em=String(AU.email).toLowerCase();
 var user=(jget('modivs_users',[])||[]).filter(function(u){return u.email===em})[0]||{};
 var req=jget('modivs_student_req',null);
 if(!req||String(req.email).toLowerCase()!==em){req=(jget('modivs_students_db',[])||[]).filter(function(x){return String(x.email).toLowerCase()===em})[0]||null}
 var form=jget('modivs_student_form',null);
 if(form&&String(form.email).toLowerCase()!==em)form=null;
 D.email=em;D.regName=AU.name||user.name||'';D.phone=user.phone||'';D.city=user.city||'';D.pass=user.pass||'';
 if(req){
  SAVED_ID=req.id||'';SAVED_STATUS=req.status||'';
  D.regName=req.parentName||D.regName;D.phone=req.phone||D.phone;D.city=req.city||D.city;
  D.stuName=req.name||'';D.cls=req.cls||'';D.board=req.board||'';D.school=req.school||'';
  D.subjects=Array.isArray(req.subs)?req.subs.filter(function(x){return x!=='General'}):[];D.level=req.level||'';
  D.goals=Array.isArray(req.goals)?req.goals:[];D.notes=req.notes||'';
  D.modes=Array.isArray(req.mode)&&req.mode.length?req.mode:D.modes;
  var nums=String(req.budget||'').replace(/,/g,'').match(/\d+/g)||[];D.budgetMin=nums[0]||'';D.budgetMax=nums[1]||nums[0]||'';
  var fm=String(req.freq||'').match(/\d+/);D.freq=fm?(+fm[0]>=6?'6 or more':fm[0]):'';
  D.role=/^Parent/.test(req.by||'')?'Parent':(req.by==='Student'?'Student':D.role);
 }
 if(!req&&!form&&em==='aarav@example.com'){D.regName=D.regName||'Aarav Sharma';D.city=D.city||'Ludhiana';D.stuName='Aarav Sharma';D.cls='Class 10';D.board='CBSE';D.subjects=['Mathematics','Physics'];D.modes=['Online','Offline (Tutor comes to my home)']}
 if(!req&&!form&&!D.stuName)D.stuName=D.regName;
 if(form){Object.keys(form).forEach(function(k){if(k!=='pass'&&k!=='agree'&&form[k]!=null)D[k]=form[k]});D.email=em}
 D.agree=false;
}
var intent = jget('modivs_search_intent', null);
if(intent && !EDIT){
 if(intent.subject && D.subjects.indexOf(intent.subject) === -1) D.subjects.push(intent.subject);
 if(intent.level) D.level = intent.level;
 if(intent.mode && D.modes.indexOf(intent.mode) === -1) D.modes = [intent.mode];
 if(intent.format && D.formats.indexOf(intent.format) === -1) D.formats = [intent.format];
}
var step=EDIT?1:0,submitted=false,tT;
var f=document.getElementById('form');
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function toast(t){var e=document.getElementById('toast');e.textContent=t;e.classList.remove('hide');clearTimeout(tT);tT=setTimeout(function(){e.classList.add('hide')},2400)}
function field(id,label,val,type,hint,ph){return '<label for="'+id+'">'+label+(hint?' <span class="hint">'+hint+'</span>':'')+'</label><input id="'+id+'" type="'+(type||'text')+'" value="'+esc(val)+'"'+(ph?' placeholder="'+esc(ph)+'"':'')+'>'}
function chips(name,list,sel){return '<div class="chips" role="group">'+list.map(function(x){return '<label class="chip"><input type="checkbox" data-group="'+name+'" value="'+esc(x)+'"'+(sel.indexOf(x)>-1?' checked':'')+'><span>'+esc(x)+'</span></label>'}).join('')+'</div>'}
function sel(id,label,val,opts){return '<label for="'+id+'">'+label+'</label><select id="'+id+'"><option value="">Select</option>'+opts.map(function(o){return '<option'+(o===val?' selected':'')+'>'+esc(o)+'</option>'}).join('')+'</select>'}
function nav(last){return '<div class="nav"><button type="button" class="btn ghost" data-act="back"'+(step===(EDIT?1:0)?' style="visibility:hidden"':'')+'>Back</button>'+(EDIT&&!last?'<button type="button" class="btn ghost" data-act="save">Save changes</button>':'')+'<button type="submit" class="btn">'+(last?(EDIT?'Update requirements':'Submit requirements'):(step===0?'Create account':'Save and continue'))+'</button></div>'}
var MSG='<div class="msg" id="msg" role="alert"></div>';

var views=[
function(){return '<h1>Student / Parent sign up</h1><p class="sub">Create your account as a parent or as a student, then tell us what you need.</p>'+
 '<div class="lab">I am a</div><div class="roles">'+['Parent','Student'].map(function(r){return '<label class="chip"><input type="radio" name="role" value="'+r+'"'+(D.role===r?' checked':'')+'><span>'+r+'<small>'+(r==='Parent'?'Registering for my child':'Registering for myself')+'</small></span></label>'}).join('')+'</div>'+
 field('regName','Your full name',D.regName)+'<div class="two"><div>'+field('phone','Mobile number',D.phone,'tel')+'</div><div>'+field('city','City',D.city)+'</div></div>'+
 field('email','Email',D.email,'email')+field('pass','Password',D.pass,'password','at least 8 characters')+field('pass2','Confirm password','','password')+MSG+nav()+'<p class="sub" style="margin-top:16px;font-size:0.9rem;">Already have an account? <a href="modivs-education.html#login" style="color:var(--accent-d);font-weight:600;">Log in</a> · <a href="modivs-education.html#tutor-signup" style="color:var(--accent-d);font-weight:600;">Tutor sign up</a></p>'},
function(){var p=D.role==='Parent';return '<h1>'+(p?'Your child’s details':'About you')+'</h1><p class="sub">This helps us match the right tutor.</p>'+
 field('stuName',p?'Child’s name':'Your name',D.stuName)+'<div class="two"><div>'+field('stuAge','Age',D.stuAge,'number')+'</div><div>'+sel('cls','Class / level',D.cls,CLASSES)+'</div></div>'+
 '<div class="two"><div>'+sel('board','Board',D.board,BOARDS)+'</div><div>'+field('school','School or college',D.school,'text','optional')+'</div></div>'+MSG+nav()},
function(){return '<h1>'+(EDIT?'Update your requirements':'What do you need help with?')+'</h1><p class="sub">Choose subjects and goals. Tutors see this when you send a request.</p>'+
 '<div class="lab">Subjects needed</div>'+chips('subjects',SUBJECTS,D.subjects)+
 sel('level','Current level in these subjects',D.level,['Struggling','Below average','Average','Good, want to excel'])+
 '<div class="lab">Goals</div>'+chips('goals',GOALS,D.goals)+
 '<label for="weak">Topics or areas that need most help <span class="hint">optional</span></label><textarea id="weak" placeholder="e.g. Algebra, trigonometry, English grammar">'+esc(D.weak)+'</textarea>'+
 '<label for="notes">Anything else tutors should know <span class="hint">optional</span></label><textarea id="notes" style="min-height:70px">'+esc(D.notes)+'</textarea>'+MSG+nav()},
function(){return '<h1>Tutor preferences</h1><p class="sub">Tell us how and when you want classes.</p>'+
 '<div class="lab">Teaching mode</div>'+chips('modes',['Online','Offline (Tutor comes to my home)','Offline (At tutor’s place)'],D.modes)+
 '<div class="lab">Tuition format</div>'+chips('formats',['1-on-1 Individual tuition','Group tuition (Small batch)'],D.formats)+
 field('area','Your area or locality',D.area,'text','for offline or in-person classes')+
 '<div class="two"><div>'+field('budgetMin','Budget from (₹ per hour)',D.budgetMin,'number')+'</div><div>'+field('budgetMax','Budget up to (₹ per hour)',D.budgetMax,'number')+'</div></div>'+
 '<div class="two"><div>'+sel('freq','Classes per week',D.freq,['1','2','3','4','5','6 or more'])+'</div><div>'+field('start','Preferred start date',D.start,'date')+'</div></div>'+
 '<div class="lab">Preferred days</div>'+chips('days',DAYS,D.days)+'<div class="lab">Preferred time</div>'+chips('times',TIMES,D.times)+
 '<div class="two"><div>'+sel('tGender','Tutor gender',D.tGender,['No preference','Female','Male'])+'</div><div>'+sel('demo','Demo class',D.demo,['Yes, I want a demo first','No, not needed'])+'</div></div>'+
 '<div class="lab">Language of teaching</div>'+chips('langs',LANGS,D.langs)+MSG+nav()},
function(){function tags(a){return a.map(function(x){return '<span class="tag">'+esc(x)+'</span>'}).join('')||'<span class="hint">None</span>'}
 return '<h1>Review your requirements</h1><p class="sub">Check everything, then '+(EDIT?'save your changes.':'submit to see matching tutors.')+'</p><div class="prev"><h3>'+esc(D.stuName)+'</h3>'+
 '<p class="hint">'+esc(D.cls)+' · '+esc(D.board)+' · '+esc(D.city)+(D.school?' · '+esc(D.school):'')+'</p>'+
 '<p><b>Subjects</b><br>'+tags(D.subjects)+'</p><p><b>Goals</b><br>'+tags(D.goals)+'</p>'+(D.weak?'<p><b>Needs help with</b><br>'+esc(D.weak)+'</p>':'')+
 '<p><b>Mode</b><br>'+tags(D.modes)+'</p><p><b>Tuition format</b><br>'+tags(D.formats)+'</p><p><b>Schedule</b><br>'+esc(D.freq)+' class(es) a week · '+esc(D.days.join(', '))+' · '+esc(D.times.join(', '))+'</p>'+
 '<p><b>Budget</b><br>₹'+esc(D.budgetMin)+' to ₹'+esc(D.budgetMax)+' per hour</p><p><b>Language</b><br>'+esc(D.langs.join(', '))+'</p></div>'+
 '<label class="check"><input type="checkbox" id="agree"'+(D.agree?' checked':'')+'><span>I confirm these details are correct and agree to Modiv’s Education terms. I’m '+(D.role==='Parent'?'the parent or guardian of the student.':'registering for myself.')+'</span></label>'+MSG+nav(true)}
];

function render(){
 document.getElementById('fill').style.width=(submitted?100:(step/(STEPS.length-1))*100)+'%';
 document.getElementById('steps').innerHTML=STEPS.map(function(s,i){var c=submitted||i<step?'done':(i===step?'on':'');return '<li class="'+c+'"'+(EDIT&&i>=1?' data-go="'+i+'" style="cursor:pointer" tabindex="0"':'')+'><i>'+(c==='done'?'✓':i+1)+'</i>'+s+'</li>'}).join('');
   if(submitted){
    try {
      localStorage.setItem('modivs_auth_user', JSON.stringify({ name: D.regName, email: D.email, role: 'Student / Parent' }));

      // Save student user account
      var users = JSON.parse(localStorage.getItem('modivs_users') || '[]');
      if(!users.some(function(u){ return u.email === D.email.toLowerCase(); })){
        users.push({
          name: D.regName,
          email: D.email.toLowerCase(),
          phone: D.phone,
          city: D.city,
          role: 'Student / Parent',
          created_at: new Date().toISOString()
        });
        localStorage.setItem('modivs_users', JSON.stringify(users));
      }

      // Save student profile requirement to database
      var studentReq = {
        id: SAVED_ID || ('stu_' + Date.now()),
        name: D.stuName || D.regName,
        parentName: D.regName,
        email: D.email.toLowerCase(),
        phone: D.phone,
        city: D.city,
        cls: D.cls,
        board: D.board,
        school: D.school || '',
        subs: (D.subjects && D.subjects.length) ? D.subjects : ['General'],
        level: D.level || 'Average',
        goals: D.goals || ['Academic improvement'],
        notes: D.notes || '',
        mode: D.modes || ['Online'],
        budget: '₹' + (D.budgetMin || 500) + '–' + (D.budgetMax || 800) + ' / hour',
        freq: D.freq || '3 classes a week',
        status: SAVED_STATUS || 'pending',
        sent: EDIT ? 'Updated just now' : 'Just now',
        registered_at: new Date().toISOString()
      };
      var studentsDb = JSON.parse(localStorage.getItem('modivs_students_db') || '[]');
      var exIdx = studentsDb.findIndex(function(s){ return s.email === studentReq.email; });
      if(exIdx >= 0){
        studentsDb[exIdx] = studentReq;
      } else {
        studentsDb.unshift(studentReq);
      }
      localStorage.setItem('modivs_students_db', JSON.stringify(studentsDb));
      localStorage.setItem('modivs_student_req', JSON.stringify(studentReq));
      var keep=JSON.parse(JSON.stringify(D));delete keep.pass;localStorage.setItem('modivs_student_form', JSON.stringify(keep));
      // keep the saved account details in sync
      var us2=JSON.parse(localStorage.getItem('modivs_users') || '[]');us2.forEach(function(u){if(u.email===D.email.toLowerCase()){u.name=D.regName;u.phone=D.phone;u.city=D.city}});localStorage.setItem('modivs_users',JSON.stringify(us2));

      // Publish the requirement to the Active Leads page
      var leadsDb = JSON.parse(localStorage.getItem('modivs_active_leads') || '[]');
      var lead = Object.assign({}, studentReq, { status: 'active', by: D.role === 'Parent' ? 'Parent: ' + D.regName : 'Student' });
      var lIdx = leadsDb.findIndex(function(l){ return l.email === lead.email; });
      if(lIdx >= 0){ leadsDb[lIdx] = lead; } else { leadsDb.unshift(lead); }
      localStorage.setItem('modivs_active_leads', JSON.stringify(leadsDb));

      // Sync to Firebase if connected
      if(window.EducationBFirebase){
        var fbAuth = window.EducationBFirebase.auth, firestore = window.EducationBFirebase.db;
        if(fbAuth && D.pass && !fbAuth.currentUser){
          fbAuth.createUserWithEmailAndPassword(D.email.toLowerCase(), D.pass).then(function(res){
            if(res && res.user) res.user.updateProfile({ displayName: D.regName });
          }).catch(function(){});
        }
        if(firestore){
          firestore.collection('students').doc(studentReq.id).set(studentReq, { merge: true }).catch(function(){});
          firestore.collection('leads').doc(studentReq.id).set(lead, { merge: true }).catch(function(){});
          firestore.collection('users').doc(D.email.toLowerCase().replace(/[^a-zA-Z0-9_-]/g, '_')).set({
            name: D.regName,
            email: D.email.toLowerCase(),
            phone: D.phone,
            city: D.city,
            role: 'Student / Parent',
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          }, { merge: true }).catch(function(){});
        }
      }
    } catch(err){}
    f.innerHTML='<div class="done-box"><h1>'+(EDIT?'Requirements updated!':'Requirements saved!')+'</h1><p class="sub">Thanks, '+esc(D.regName.split(' ')[0])+'. We have set up your Student Dashboard and matched verified tutors for '+esc(D.stuName)+'.</p><p><span class="status">Your Student Dashboard is ready</span></p><div class="nav" style="justify-content:center;gap:12px;margin-top:20px;"><a href="modivs-student-dashboard.html" class="btn" style="text-decoration:none;display:inline-flex;align-items:center;padding:12px 24px;">Open Student Dashboard &rarr;</a><a href="modivs-home.html" class="btn ghost" style="text-decoration:none;display:inline-flex;align-items:center;padding:12px 24px;">Home</a><button type="button" class="btn ghost" data-act="edit">Edit requirements</button></div></div>';
    return;
  }
 f.innerHTML=views[step]();window.scrollTo(0,0);
}
function v(id){var e=document.getElementById(id);return e?e.value.trim():''}
function group(n){return Array.prototype.map.call(f.querySelectorAll('input[data-group="'+n+'"]:checked'),function(x){return x.value})}
function flag(id,m){var e=document.getElementById(id);if(e){e.classList.add('bad');e.focus()}document.getElementById('msg').textContent=m;return false}
function say(m){document.getElementById('msg').textContent=m;return false}

function read(){ // store current inputs
 if(step===0){var r=f.querySelector('input[name=role]:checked');if(r)D.role=r.value;D.regName=v('regName');D.phone=v('phone');D.city=v('city');D.email=v('email');D.pass=v('pass')}
 if(step===1){D.stuName=v('stuName');D.stuAge=v('stuAge');D.cls=v('cls');D.board=v('board');D.school=v('school')}
 if(step===2){D.subjects=group('subjects');D.level=v('level');D.goals=group('goals');D.weak=v('weak');D.notes=v('notes')}
 if(step===3){D.modes=group('modes');D.formats=group('formats');D.area=v('area');D.budgetMin=v('budgetMin');D.budgetMax=v('budgetMax');D.freq=v('freq');D.start=v('start');D.days=group('days');D.times=group('times');D.tGender=v('tGender');D.demo=v('demo');D.langs=group('langs')}
 if(step===4){D.agree=document.getElementById('agree').checked}
}
function check(){
 f.querySelectorAll('.bad').forEach(function(e){e.classList.remove('bad')});
 if(step===0){
  if(!D.regName)return flag('regName','Enter your full name.');
  if(!/^[+0-9\s-]{10,15}$/.test(D.phone))return flag('phone','Enter a valid mobile number.');
  if(!D.city)return flag('city','Enter your city.');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(D.email))return flag('email','Enter a valid email address.');
  if(D.pass.length<8)return flag('pass','Use at least 8 characters for your password.');
  if(D.pass!==v('pass2'))return flag('pass2','Passwords do not match.')}
 if(step===1){
  if(!D.stuName)return flag('stuName','Enter a name.');
  if(!(+D.stuAge>=3&&+D.stuAge<=70))return flag('stuAge','Enter an age between 3 and 70.');
  if(!D.cls)return flag('cls','Choose a class or level.');
  if(!D.board)return flag('board','Choose a board.')}
 if(step===2){
  if(!D.subjects.length)return say('Choose at least one subject.');
  if(!D.level)return flag('level','Choose the current level.');
  if(!D.goals.length)return say('Choose at least one goal.')}
 if(step===3){
  if(!D.modes.length)return say('Choose at least one teaching mode.');
  if(!D.formats.length)return say('Choose at least one tuition format (1-on-1 or group).');
  if(D.modes.some(function(m){return m.indexOf('Offline')>-1})&&!D.area)return flag('area','Enter your area for offline in-person classes.');
  if(!(+D.budgetMin>0))return flag('budgetMin','Enter your minimum budget.');
  if(+D.budgetMax<+D.budgetMin)return flag('budgetMax','Maximum budget must be at least the minimum.');
  if(!D.freq)return flag('freq','Choose classes per week.');
  if(!D.days.length)return say('Choose at least one preferred day.');
  if(!D.times.length)return say('Choose at least one preferred time.');
  if(!D.langs.length)return say('Choose at least one language.')}
 if(step===4&&!D.agree)return say('Tick the confirmation to submit.');
 return true;
}
f.addEventListener('submit',function(e){e.preventDefault();read();if(!check())return;
 if(step===4){submitted=true;render();return}
 step++;render();toast('Progress saved')});
function saveAll(){ // edit mode: validate steps 1-3, then save without walking through the review step
 read();var keep=step;
 for(var st=1;st<=3;st++){step=st;render();if(!check())return}
 D.agree=true;submitted=true;render()}
document.getElementById('steps').addEventListener('click',function(e){
 var li=e.target.closest('li[data-go]');if(!li||!EDIT||submitted)return;
 read();step=+li.getAttribute('data-go');render()});
document.getElementById('steps').addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){var li=e.target.closest('li[data-go]');if(li){e.preventDefault();li.click()}}});
f.addEventListener('click',function(e){var a=e.target.getAttribute('data-act');
 if(a==='save'){saveAll();return}
 if(a==='back'){read();step--;render()}
 if(a==='edit'){submitted=false;step=1;render()}});
(function(){var t=document.getElementById('topLinks');if(!t)return;
 var au=null;try{au=JSON.parse(localStorage.getItem('modivs_auth_user')||'null')}catch(e){}
 if(au&&au.role==='Student / Parent'){var a=document.createElement('a');a.href='modivs-student-dashboard.html';a.textContent='My dashboard';t.appendChild(a)}
})();
render();
})();
</script>
