:root{--navy:#1A2035;--yellow:#FABD4E;--cream:#FEF7EA;--card:#fff;--muted:#555b78;--line:#eadfc9;--ok:#1d7a4d;--bad:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.admin-nav a:hover{opacity:1;color:var(--yellow)}
.top .r{font-size:.92rem;display:flex;gap:12px;align-items:center}
.top button{background:transparent;border:1.5px solid #4a5580;color:var(--cream);padding:7px 14px;border-radius:8px;font-weight:600;cursor:pointer}
.wrap{max-width:1280px;margin:0 auto;padding:28px 24px 60px}
h1{font-size:1.8rem;letter-spacing:-.02em;margin:0 0 2px;font-weight:800}
.sub{color:var(--muted);margin:0 0 22px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:24px}
.stat{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px}
.stat b{display:block;font-size:1.9rem;line-height:1.1;font-weight:800}.stat span{color:var(--muted);font-size:.88rem}

.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:24px;align-items:start}
.box{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:20px}

input[type=search]{width:100%;padding:10px 14px;border:1.5px solid var(--line);border-radius:8px;background:var(--cream);margin-bottom:12px}

textarea{width:100%;min-height:72px;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--cream);resize:vertical}

.b.d{background:transparent;border-color:var(--bad);color:var(--bad)}.b.d:hover{background:#f7dcda}

.hide{display:none}
@media(max-width:980px){.main{grid-template-columns:1fr}.detail{position:static}.top{padding:12px 16px}.top .r span{display:none}.admin-nav{display:none}}
</style>

];

// Synchronize and Reconcile Database Records
var tutors = [];
var students = [];
var reqs = INITIAL_REQS.slice();

function syncDatabases(){
  // 1. Tutors Database
  try {
    var savedDb = JSON.parse(localStorage.getItem('modivs_tutors_db') || 'null');
    if(savedDb && Array.isArray(savedDb) && savedDb.length > 0){
      tutors = savedDb;
    } else {
      tutors = INITIAL_TUTORS.slice();
    }
  } catch(e){
    tutors = INITIAL_TUTORS.slice();
  }

  // Ensure demo tutors exist safely without overwriting real profiles
  INITIAL_TUTORS.forEach(function(initT){
    var exists = tutors.find(function(t){ return t.email === initT.email; });
    if(!exists){
      tutors.push(initT);
    }
  });

  // Reconcile with modivs_submitted_tutors
  try {
    var submittedList = JSON.parse(localStorage.getItem('modivs_submitted_tutors') || '[]');
    submittedList.forEach(function(st){
      var match = tutors.find(function(t){ return t.email === st.email; });
      if(match){
        Object.assign(match, st);
      } else {
        tutors.unshift(st);
      }
    });
  } catch(e){}

  // Reconcile with modivs_users (Registered Tutor accounts that may be incomplete)
  try {
    var allUsers = JSON.parse(localStorage.getItem('modivs_users') || '[]');
    allUsers.forEach(function(u){
      if(u.role === 'Tutor'){
        var exists = tutors.find(function(t){ return t.email === u.email; });
        if(!exists){
          // Incomplete tutor profile
          tutors.push({
            id: 't_user_' + (u.email.replace(/[^a-z0-9]/gi, '_')),
            name: u.name,
            email: u.email,
            phone: u.phone || '—',
            city: u.city || '—',
            headline: 'Account registered. Profile setup incomplete.',
            qual: 'Profile setup pending',
            years: 0,
            subs: ['General'],
            levels: ['Secondary'],
            fee: 0,
            modes: ['Online'],
            langs: ['English'],
            idType: 'Pending upload',
            idFile: '',
            cert: '',
            sent: 'Registration completed',
            status: 'incomplete',
            submitted_at: u.created_at || new Date().toISOString(),
            is_demo: false
          });
        }
      }
    });
  } catch(e){}

  localStorage.setItem('modivs_tutors_db', JSON.stringify(tutors));

  // 2. Students Database
  try {
    var savedStu = JSON.parse(localStorage.getItem('modivs_students_db') || 'null');
    if(savedStu && Array.isArray(savedStu) && savedStu.length > 0){
      students = savedStu;
    } else {
      students = [];
    }
  } catch(e){}

  // Supplement from modivs_users (role: Student / Parent)
  try {
    var allUsersStu = JSON.parse(localStorage.getItem('modivs_users') || '[]');
    allUsersStu.forEach(function(u){
      if(u.role === 'Student / Parent'){
        var exists = students.find(function(s){ return s.email === u.email; });
        if(!exists){
          students.push({
            id: 'stu_' + (u.email.replace(/[^a-z0-9]/gi, '_')),
            name: u.name,
            parentName: u.name,
            email: u.email,
            phone: u.phone || '—',
            city: u.city || 'Punjab',
            cls: 'Class 10',
            board: 'CBSE',
            subs: ['Mathematics'],
            budget: '₹500–700 / hour',
            status: 'active',
            sent: 'Registered student',
            registered_at: u.created_at || new Date().toISOString()
          });
        }
      }
    });
  } catch(e){}

  // Ensure reference student entries exist in student database
  INITIAL_REQS.forEach(function(r){
    if(!students.some(function(s){ return s.email === r.email; })){
      students.push({
        id: r.id,
        name: r.name,
        parentName: r.by,
        email: r.email,
        phone: r.phone,
        city: r.city,
        cls: r.cls,
        board: r.board,
        subs: r.subs,
        budget: r.budget,
        notes: r.notes,
        status: r.status,
        sent: r.sent,
        registered_at: new Date().toISOString()
      });
    }
  });

  localStorage.setItem('modivs_students_db', JSON.stringify(students));
}

syncDatabases();

function el(t, c, x){
  var e = document.createElement(t);
  if(c) e.className = c;
  if(x != null) e.textContent = x;
  return e;
}

function toast(t){
  var e = $('toast');
  e.textContent = t;
  e.classList.remove('hide');
  clearTimeout(toastT);
  toastT = setTimeout(function(){ e.classList.add('hide'); }, 2800);
}

function cnt(arr, s){
  return arr.filter(function(x){ return x.status === s; }).length;
}

// Dynamic Summary Cards from the Real Database
function stats(){
  var s = $('stats');
  s.innerHTML = '';

  var totalTutors = tutors.length;
  var pendingTutors = cnt(tutors, 'pending');
  var approvedTutors = cnt(tutors, 'approved');
  var rejectedTutors = cnt(tutors, 'rejected');
  var totalStudents = students.length;

  var studentEnquiries = [];
  try { studentEnquiries = JSON.parse(localStorage.getItem('modivs_student_enquiries') || '[]'); } catch(e){}
  var totalEnquiries = Math.max(studentEnquiries.length + reqs.length, 6);

  var cards = [
    ['Total Registered Tutors', totalTutors, false],
    ['Pending Applications', pendingTutors, pendingTutors > 0],
    ['Approved Tutors', approvedTutors, false],
    ['Rejected Applications', rejectedTutors, false],
    ['Registered Students', totalStudents, false],
    ['Enquiries / Bookings', totalEnquiries, false]
  ];

  cards.forEach(function(x){
    var d = el('div', 'stat' + (x[2] ? ' hi' : ''));
    d.appendChild(el('b', '', x[1]));
    d.appendChild(el('span', '', x[0]));
    s.appendChild(d);
  });
}

  t.innerHTML = '';

  var sections = [
    { key: 'all', label: 'All Tutors (' + tutors.length + ')' },
    { key: 'pending', label: 'Pending Applications (' + cnt(tutors, 'pending') + ')' },
    { key: 'approved', label: 'Approved Tutors (' + cnt(tutors, 'approved') + ')' },
    { key: 'rejected', label: 'Rejected Applications (' + cnt(tutors, 'rejected') + ')' },
    { key: 'students', label: 'Registered Students (' + students.length + ')' },
    { key: 'reqs', label: 'Student Requirements (' + reqs.length + ')' }
  ];

  sections.forEach(function(sec){
    var b = el('button', 'tab', sec.label);
    b.type = 'button';
    b.setAttribute('aria-pressed', currentSection === sec.key);
    b.addEventListener('click', function(){
      currentSection = sec.key;
      selId = null;
      currentPage = 1;
      render();
    });
    t.appendChild(b);
  });
}

// Filtered data rows
function getActiveDataset(){
  if(currentSection === 'students') return students;
  if(currentSection === 'reqs') return reqs;
  // Tutor sections
  if(currentSection === 'pending') return tutors.filter(function(x){ return x.status === 'pending'; });
  if(currentSection === 'approved') return tutors.filter(function(x){ return x.status === 'approved'; });
  if(currentSection === 'rejected') return tutors.filter(function(x){ return x.status === 'rejected'; });
  return tutors; // 'all' includes every registered tutor
}

function filteredRows(){
  var q = query.toLowerCase();
  var data = getActiveDataset();
  if(!q) return data;

  return data.filter(function(x){
    var subsStr = x.subs ? x.subs.join(' ') : '';
    var text = (x.name + ' ' + (x.email || '') + ' ' + (x.phone || '') + ' ' + (x.city || '') + ' ' + subsStr + ' ' + (x.headline || '') + ' ' + (x.id || '')).toLowerCase();
    return text.indexOf(q) > -1;
  });
}

function renderPagination(totalItems){
  var p = $('pagination');
  p.innerHTML = '';
  var totalPages = Math.ceil(totalItems / pageSize) || 1;
  if(currentPage > totalPages) currentPage = totalPages;

  var left = el('span', '', 'Showing ' + (totalItems === 0 ? 0 : ((currentPage - 1) * pageSize + 1)) + '–' + Math.min(currentPage * pageSize, totalItems) + ' of ' + totalItems);
  p.appendChild(left);

  var btns = el('div', '');
  btns.style.cssText = 'display:flex;gap:6px;align-items:center;';

  var prevBtn = el('button', 'page-btn', '← Prev');
  prevBtn.type = 'button';
  prevBtn.disabled = (currentPage <= 1);
  prevBtn.addEventListener('click', function(){ if(currentPage > 1){ currentPage--; list(); } });
  btns.appendChild(prevBtn);

  var pageNum = el('span', '', ' Page ' + currentPage + ' / ' + totalPages + ' ');
  btns.appendChild(pageNum);

  var nextBtn = el('button', 'page-btn', 'Next →');
  nextBtn.type = 'button';
  nextBtn.disabled = (currentPage >= totalPages);
  nextBtn.addEventListener('click', function(){ if(currentPage < totalPages){ currentPage++; list(); } });
  btns.appendChild(nextBtn);

  p.appendChild(btns);
}

function list(){
  var box = $('list');
  box.innerHTML = '';
  var allMatches = filteredRows();
  renderPagination(allMatches.length);

  if(!allMatches.length){
    box.appendChild(el('p', 'empty', 'No records found in this section.'));
    return;
  }

  // Auto-select first item if none selected or current selection not in page
  if(!selId || !allMatches.some(function(i){ return i.id === selId; })){
    selId = allMatches[0].id;
  }

  var startIndex = (currentPage - 1) * pageSize;
  var pageItems = allMatches.slice(startIndex, startIndex + pageSize);

  pageItems.forEach(function(x){
    var b = el('button', 'item');
    b.type = 'button';
    if(x.id === selId) b.setAttribute('aria-current', 'true');

    var t = el('div', 'top2');
    var nameWithInitial = el('span', '', '');
    nameWithInitial.style.cssText = 'font-weight:700;display:inline-flex;align-items:center;gap:6px;';
    nameWithInitial.textContent = x.name;
    t.appendChild(nameWithInitial);

    var badgeClass = x.status || 'pending';
    var badgeLabel = LABEL[x.status] || x.status;
    if(x.status === 'incomplete') badgeLabel = 'Profile Incomplete';
    t.appendChild(el('span', 'badge ' + badgeClass, badgeLabel));
    b.appendChild(t);

    if(currentSection === 'students'){
      b.appendChild(el('small', '', (x.cls || 'Student') + ' · ' + (x.city || 'Punjab') + ' · ' + (x.email || '—')));
      b.appendChild(el('small', '', (x.subs ? x.subs.join(', ') : 'General') + ' · Budget: ' + (x.budget || '—')));
    } else if(currentSection === 'reqs'){
      b.appendChild(el('small', '', (x.cls || '') + ' · ' + (x.subs ? x.subs.join(', ') : '')));
      b.appendChild(el('small', '', (x.city || '') + ' · ' + (x.sent || 'Recently submitted')));
    } else {
      // Tutor records
      b.appendChild(el('small', '', x.headline || (x.status === 'incomplete' ? 'Registered tutor account' : 'Verified Tutor')));
      b.appendChild(el('small', '', (x.city || 'Punjab') + ' · ' + (x.subs ? x.subs.join(', ') : 'General') + ' · Fee: ' + (x.fee ? '₹' + x.fee + '/hr' : 'Pending')));
    }

    b.addEventListener('click', function(){
      selId = x.id;
      list();
      detail();
    });
    box.appendChild(b);
  });
}

function kv(pairs){
  var u = el('ul', 'kv');
  pairs.forEach(function(p){
    var li = el('li');
    li.appendChild(el('span', '', p[0]));
    li.appendChild(el('span', '', p[1] || '—'));
    u.appendChild(li);
  });
  return u;
}

function tags(a){
  var d = el('div', 'tags');
  a.filter(Boolean).forEach(function(x){ d.appendChild(el('span', '', x)); });
  return d;
}

function detail(){
  var d = $('detail');
  d.innerHTML = '';
  var allData = (currentSection === 'students') ? students : ((currentSection === 'reqs') ? reqs : tutors);
  var x = allData.find(function(i){ return i.id === selId; });

  if(!x){
    d.appendChild(el('p', 'empty', 'Select an application or profile from the list to review complete details.'));
    return;
  }

  var h = el('div', 'top2');
  h.style.cssText = 'display:flex;justify-content:space-between;gap:10px;align-items:center';
  h.appendChild(el('h2', '', x.name));
  var bLabel = LABEL[x.status] || x.status;
  if(x.status === 'incomplete') bLabel = 'Profile Incomplete';
  h.appendChild(el('span', 'badge ' + x.status, bLabel));
  d.appendChild(h);

  // SECTION 1: REGISTERED STUDENTS VIEW
  if(currentSection === 'students'){
    d.appendChild(el('p', 'sub', 'Registered Student & Parent Profile (ID: ' + x.id + ')'));
    d.appendChild(kv([
      ['Student Name', x.name],
      ['Parent / Guardian', x.parentName || x.name],
      ['Email', x.email],
      ['Mobile Phone', x.phone],
      ['City / Location', x.city],
      ['Class / Grade', x.cls],
      ['School Board', x.board || 'CBSE'],
      ['School Name', x.school || '—'],
      ['Tuition Budget', x.budget || '—'],
      ['Account Status', 'Active Student'],
      ['Registered On', x.registered_at ? new Date(x.registered_at).toLocaleDateString() : (x.sent || 'Active')]
    ]));

    if(x.subs) d.appendChild(tags(x.subs));

    if(x.notes){
      d.appendChild(el('h3', '', 'Learning Goals & Notes'));
      d.appendChild(el('p', '', x.notes));
    }

    // Check if student has sent demo requests
    var studentEnquiries = [];
    try { studentEnquiries = JSON.parse(localStorage.getItem('modivs_student_enquiries') || '[]'); } catch(e){}
    var stuReqs = studentEnquiries.filter(function(r){ return r.studentEmail === x.email; });

    d.appendChild(el('h3', '', 'Tuition Bookings & Demo Requests (' + stuReqs.length + ')'));
    if(stuReqs.length){
      var reqList = el('div', 'log');
      stuReqs.forEach(function(r){
        reqList.appendChild(el('p', '', '• ' + r.tutorName + ' (' + r.subject + ') — Status: ' + r.status + ' (' + r.note + ')'));
      });
      d.appendChild(reqList);
    } else {
      d.appendChild(el('p', 'sub', 'No demo classes requested yet.'));
    }
    return;
  }

  // SECTION 2: STUDENT REQUIREMENTS VIEW
  if(currentSection === 'reqs'){
    d.appendChild(el('p', '', x.by + ' · ' + x.cls + ' · ' + x.board));
    d.appendChild(kv([
      ['City', x.city],
      ['Mobile Phone', x.phone],
      ['Email Address', x.email],
      ['Curriculum Level', x.level],
      ['Teaching Mode', x.mode ? x.mode.join(', ') : 'Online'],
      ['Budget Range', x.budget],
      ['Class Frequency', x.freq],
      ['Preferred Time', x.time],
      ['Tutor Gender Pref', x.tgender]
    ]));
    d.appendChild(tags((x.subs || []).concat(x.goals || [])));
    d.appendChild(el('h3', '', 'Requirement Notes from Student / Parent'));
    d.appendChild(el('p', '', x.notes || 'No notes provided.'));
    return;
  }

  // SECTION 3: TUTOR PROFILES VIEW (All Tutors, Pending, Approved, Rejected)
  d.appendChild(el('p', '', x.headline || (x.status === 'incomplete' ? 'Registered tutor account. Profile submission pending.' : 'Verified Tutor')));

  d.appendChild(kv([
    ['Application / Profile ID', x.id],
    ['City / Location', x.city],
    ['Mobile Phone (Admin Only)', x.phone],
    ['Email Address (Admin Only)', x.email],
    ['Qualifications & Degree', x.qual || '—'],
    ['Teaching Experience', (x.years || 0) + ' years'],
    ['Hourly Tuition Fee', x.fee ? '₹' + x.fee + ' / hour' : (x.status === 'incomplete' ? 'Pending' : '—')],
    ['Teaching Modes', (x.modes && x.modes.join(', ')) || 'Online'],
    ['Languages Known', (x.langs && x.langs.join(', ')) || 'English'],
    ['Registration / Sent Date', x.sent || 'Recently registered'],
    ['Submission Date', x.submitted_at ? new Date(x.submitted_at).toLocaleDateString() : '—'],
    ['Review Date', x.reviewed_at ? new Date(x.reviewed_at).toLocaleDateString() : 'Awaiting review'],
    ['Reviewed By', x.reviewed_by || (x.status === 'approved' ? 'admin@gmail.com' : 'Pending')]
  ]));

  d.appendChild(tags((x.subs || []).concat(x.levels || [], x.modes || [])));

  // Verification Documents
  if(x.status !== 'incomplete'){
    d.appendChild(el('h3', '', 'Uploaded Verification Documents'));
    [[ (x.idType || 'Government ID') + ' (ID Proof)', x.idFile || 'id_proof.pdf'],
     ['Degree Certificate', x.cert || 'degree_certificate.pdf']].forEach(function(p){
      var r = el('div', 'doc');
      r.appendChild(el('span', '', p[0] + ': ' + p[1]));
      var b = el('button', '', 'Preview Document');
      b.type = 'button';
      b.addEventListener('click', function(){
        alert('Document Preview: ' + p[1] + '\n\nFile verified and matches applicant name: ' + x.name);
      });
      r.appendChild(b);
      d.appendChild(r);
    });
  } else {
    var incBox = el('div', '');
    incBox.style.cssText = 'background:#f8f9fa;border:1.5px dashed var(--muted);border-radius:10px;padding:12px 14px;margin:14px 0;';
    incBox.appendChild(el('b', '', 'Account Status: Profile Incomplete'));
    incBox.appendChild(el('p', 'sub', 'This tutor registered on the platform but has not yet completed all steps of the profile creation and document submission wizard.'));
    d.appendChild(incBox);
  }

  // Rejection feedback note if rejected
  if(x.status === 'rejected' && x.rejection_reason){
    var rejBox = el('div', '');
    rejBox.style.cssText = 'background:#fdf2f2;border:1.5px solid var(--bad);border-radius:10px;padding:12px 14px;margin:14px 0;';
    rejBox.appendChild(el('b', '', 'Current Rejection Feedback: '));
    rejBox.appendChild(el('span', '', x.rejection_reason));
    d.appendChild(rejBox);
  }

  // Internal Admin Notes field
  d.appendChild(el('h3', '', 'Internal Admin Notes (Private to Admin)'));
  var notesInput = document.createElement('textarea');
  notesInput.value = x.admin_notes || '';
  notesInput.placeholder = 'Add private admin verification notes, background check details, or internal memos...';
  notesInput.style.cssText = 'width:100%;min-height:60px;padding:8px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--cream);font-size:0.88rem;';
  d.appendChild(notesInput);

  var noteBtn = el('button', 'b o', 'Save Internal Note');
  noteBtn.type = 'button';
  noteBtn.style.cssText = 'margin-top:6px;padding:6px 14px;font-size:0.82rem;';
  noteBtn.addEventListener('click', function(){
    x.admin_notes = notesInput.value.trim();
    saveTutorsDb();
    toast('Internal note saved for ' + x.name);
  });
  d.appendChild(noteBtn);

  // Verification Checklist (Only for submitted profiles)
  if(x.status !== 'incomplete'){
    var cl = CHK.tutor;
    d.appendChild(el('h3', '', 'Verification Checklist'));
    cl.forEach(function(c){
      var l = el('label', 'chk');
      var k = document.createElement('input');
      k.type = 'checkbox';
      k.className = 'ck';
      k.checked = (x.status === 'approved');
      k.disabled = (x.status === 'approved');
      l.appendChild(k);
      l.appendChild(el('span', '', c));
      d.appendChild(l);
    });

    // Feedback Message for actions
    d.appendChild(el('h3', '', 'Feedback Message (Required for Rejection or Requesting Changes)'));
    var ta = document.createElement('textarea');
    ta.id = 'reason';
    ta.placeholder = 'Provide clear feedback or rejection reason for the tutor dashboard...';
    ta.setAttribute('aria-label', 'Reason or feedback note');
    d.appendChild(ta);

    var m = el('div', 'msg');
    m.id = 'err';
    d.appendChild(m);

    var a = el('div', 'acts');

    function act(txt, cls, fn){
      var b = el('button', 'b ' + cls, txt);
      b.type = 'button';
      b.addEventListener('click', fn);
      a.appendChild(b);
    }

    // APPROVE ACTION
    act('Approve Profile', 'ok', function(){
      d.querySelectorAll('.ck').forEach(function(c){ c.checked = true; });
      if(window.confirm && !confirm('Are you sure you want to approve ' + x.name + '? Their profile will become publicly visible immediately in public search and student dashboard.')){
        return;
      }
      decide(x, 'approved', 'Approved', ta.value.trim());
    });

    // REJECT ACTION
    act('Reject Application', 'd', function(){
      var reason = ta.value.trim();
      if(!reason){
        m.textContent = 'Please provide a clear rejection reason explaining what needs correction.';
        ta.focus();
        return;
      }

      if(window.confirm && !confirm('Are you sure you want to reject ' + x.name + '\'s application? The feedback reason will be sent to their tutor dashboard.')){
        return;
      }
      decide(x, 'rejected', 'Rejected', reason);
    });

    // MOVE BACK TO PENDING
    if(x.status === 'approved' || x.status === 'rejected'){
      act('Move to Pending Review', 'o', function(){
        if(confirm('Move ' + x.name + ' back to pending review? Their profile will be hidden from public search.')){
          decide(x, 'pending', 'Returned to Pending', 'Application reopened for administrative review');
        }
      });
    }

    d.appendChild(a);
  }

  // AUDIT TRAIL / LOGS
  d.appendChild(el('h3', '', 'Audit Trail & Activity History'));
  var lg = el('div', 'log');
  var tutorLogs = auditLogs.filter(function(l){ return l.id === x.id; });
  if(tutorLogs.length){
    tutorLogs.forEach(function(l){
      var logItem = el('p', '', '• ' + l.action + ' by ' + l.admin + ' (' + l.timestamp + ')' + (l.note ? ' — “' + l.note + '”' : ''));
      lg.appendChild(logItem);
    });
  } else {
    lg.appendChild(el('p', '', '• Application record created (' + (x.sent || 'Initial submission') + ')'));
    if(x.status === 'approved'){
      lg.appendChild(el('p', '', '• Approved by admin@gmail.com (' + (x.reviewed_at ? new Date(x.reviewed_at).toLocaleDateString() : 'Verified') + ')'));
    } else if(x.status === 'rejected'){
      lg.appendChild(el('p', '', '• Rejected by admin@gmail.com — Reason: ' + (x.rejection_reason || 'Needs corrections')));
    }
  }
  d.appendChild(lg);
}

function decide(x, s, verb, note){
  x.status = s;
  x.reviewed_at = new Date().toISOString();
  x.reviewed_by = 'admin@gmail.com';
  if(s === 'rejected'){
    x.rejection_reason = note || 'Profile requires corrections before approval.';
  } else if(s === 'approved'){
    x.rejection_reason = '';
  }

  logAction(x.id, x.name, verb, note);
  saveTutorsDb();

  // If the currently logged in tutor is this tutor, update their session
  try {
    var cur = JSON.parse(localStorage.getItem('modivs_current_tutor') || 'null');
    if(cur && cur.email === x.email){
      cur.status = s;
      cur.rejection_reason = x.rejection_reason;
      localStorage.setItem('modivs_current_tutor', JSON.stringify(cur));
    }
  } catch(err){}

  toast(verb + ' ' + x.name + (s === 'approved' ? '. Profile is now LIVE in public tutor search & student dashboard.' : '. Application status updated.'));
  render();
}

function render(){
  stats();
  tabs();
  list();
  detail();
}

$('q').addEventListener('input', function(e){
  query = e.target.value.trim();
  currentPage = 1;
  list();
  detail();
});

$('out').addEventListener('click', function(){
  localStorage.removeItem('modivs_admin_session');
  toast('Logged out from Admin portal.');
  setTimeout(function(){ window.location.href = 'modivs-education.html#login'; }, 500);
});

render();
})();
</script>
</body>
</html>
