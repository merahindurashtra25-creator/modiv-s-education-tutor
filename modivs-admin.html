<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#1A2035;--yellow:#FABD4E;--cream:#FEF7EA;--card:#fff;--muted:#555b78;--line:#eadfc9;--ok:#1d7a4d;--bad:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--cream);color:var(--navy);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:is(a,button,input,select,textarea):focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;background:var(--navy);color:var(--cream);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.brand{font-weight:800;font-size:1.2rem}.brand span{background:var(--yellow);color:var(--navy);padding:0 8px;border-radius:6px;margin-left:2px}
.top .r{font-size:.92rem;display:flex;gap:12px;align-items:center}
.top button{background:transparent;border:1.5px solid #4a5580;color:var(--cream);padding:7px 14px;border-radius:8px;font-weight:600;cursor:pointer}
.wrap{max-width:1280px;margin:0 auto;padding:28px 24px 60px}
h1{font-size:1.8rem;letter-spacing:-.02em;margin:0 0 2px;font-weight:800}
.sub{color:var(--muted);margin:0 0 22px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:24px}
.stat{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px}
.stat b{display:block;font-size:1.9rem;line-height:1.1;font-weight:800}.stat span{color:var(--muted);font-size:.88rem}
.stat.hi{background:var(--yellow);border-color:var(--yellow)}.stat.hi span{color:var(--navy)}
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:24px;align-items:start}
.box{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:20px}
.seg{display:flex;gap:6px;background:var(--cream);border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{flex:1;padding:9px;border:0;border-radius:9px;background:transparent;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--navy);color:var(--cream)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{padding:6px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);font-weight:600;cursor:pointer;font-size:.86rem;color:var(--muted)}
.tab[aria-pressed=true]{background:var(--yellow);border-color:var(--yellow);color:var(--navy)}
input[type=search]{width:100%;padding:9px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--cream);margin-bottom:12px}
.item{display:block;width:100%;text-align:left;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;margin-bottom:10px;background:var(--card);cursor:pointer}
.item:hover{border-color:var(--navy)}
.item[aria-current=true]{border-color:var(--navy);background:var(--cream);box-shadow:0 0 0 2px var(--yellow)}
.item b{font-size:1rem}.item small{display:block;color:var(--muted)}
.item .top2{display:flex;justify-content:space-between;gap:10px;align-items:center}
.badge{display:inline-block;font-size:.76rem;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--yellow);white-space:nowrap}
.badge.approved{background:#d9f0e3;color:var(--ok)}.badge.rejected{background:#f7dcda;color:var(--bad)}.badge.changes{background:#dfe5fb;color:#27407f}
.empty{color:var(--muted);text-align:center;padding:26px 0}
.detail{position:sticky;top:84px}
.detail h2{margin:0;font-size:1.4rem}
.kv{margin:14px 0;padding:0;list-style:none}
.kv li{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-top:1px solid var(--line);font-size:.93rem}
.kv li span:first-child{color:var(--muted);flex:none}.kv li span:last-child{text-align:right;font-weight:600}
.tags span{display:inline-block;background:var(--cream);border:1px solid var(--line);font-size:.8rem;font-weight:600;padding:2px 10px;border-radius:99px;margin:2px 4px 2px 0}
.doc{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--cream);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:.9rem}
.doc button{border:1.5px solid var(--navy);background:var(--card);border-radius:8px;padding:5px 12px;font-weight:600;cursor:pointer;font-size:.82rem}
.chk{display:flex;gap:10px;align-items:flex-start;margin:8px 0;font-size:.93rem}
.chk input{margin-top:4px;accent-color:var(--navy);width:16px;height:16px}
h3{font-size:.95rem;margin:18px 0 6px}
textarea{width:100%;min-height:72px;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--cream);resize:vertical}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.b{padding:10px 18px;border-radius:9px;border:2px solid var(--navy);background:var(--navy);color:var(--cream);font-weight:600;cursor:pointer}
.b:hover{background:#2a3350}
.b.ok{background:var(--yellow);border-color:var(--yellow);color:var(--navy)}.b.ok:hover{background:#ffc965}
.b.o{background:transparent;color:var(--navy)}.b.o:hover{background:var(--cream)}
.b.d{background:transparent;border-color:var(--bad);color:var(--bad)}.b.d:hover{background:#f7dcda}
.msg{color:var(--bad);font-size:.88rem;min-height:1.3em;margin-top:10px}
.log{margin-top:20px;font-size:.88rem;color:var(--muted)}
.log p{margin:3px 0}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:var(--cream);padding:11px 18px;border-radius:8px;font-size:.9rem;max-width:90vw}
.hide{display:none}
.admin-nav{display:flex;gap:16px;align-items:center;font-size:.88rem;font-weight:600}
.admin-nav a{color:var(--cream);text-decoration:none;opacity:.82;transition:opacity .15s}
.admin-nav a:hover{opacity:1;color:var(--yellow)}
@media(max-width:980px){.main{grid-template-columns:1fr}.detail{position:static}.top{padding:12px 16px}.top .r span{display:none}.admin-nav{display:none}}
</style>

function el(t,c,x){
  var e = document.createElement(t);
  if(c) e.className = c;
  if(x != null) e.textContent = x;
  return e;
}

function toast(t){
  var e = $('toast');
  e.textContent = t;
  e.classList.remove('hide');
  clearTimeout(toastT);
  toastT = setTimeout(function(){ e.classList.add('hide'); }, 2600);

function data(){ return type === 'tutor' ? tutors : reqs; }
function cnt(arr, s){ return arr.filter(function(x){ return x.status === s; }).length; }

// Dynamic Summary Cards from the real database
function stats(){
  var s = $('stats');
  s.innerHTML = '';

  var totalTutors = tutors.length;
  var pendingTutors = cnt(tutors, 'pending');
  var approvedTutors = cnt(tutors, 'approved');
  var rejectedTutors = cnt(tutors, 'rejected');

  // Count registered students
  var users = [];
  try { users = JSON.parse(localStorage.getItem('modivs_users') || '[]'); } catch(e){}
  var studentUsers = users.filter(function(u){ return u.role === 'Student / Parent'; });
  var totalStudents = Math.max(studentUsers.length + 3, 4);

  // Count enquiries
  var studentEnquiries = [];
  try { studentEnquiries = JSON.parse(localStorage.getItem('modivs_student_enquiries') || '[]'); } catch(e){}
  var totalEnquiries = Math.max(studentEnquiries.length + reqs.length, 6);

  var cards = [
    ['Total Registered Tutors', totalTutors, false],
    ['Pending Applications', pendingTutors, pendingTutors > 0],
    ['Approved Tutors', approvedTutors, false],
    ['Rejected Applications', rejectedTutors, false],
    ['Total Registered Students', totalStudents, false],
    ['Total Enquiries / Bookings', totalEnquiries, false]
  ];

  cards.forEach(function(x){
    var d = el('div', 'stat' + (x[2] ? ' hi' : ''));
    d.appendChild(el('b', '', x[1]));
    d.appendChild(el('span', '', x[0]));
    s.appendChild(d);
  });
}

function tabs(){

    var n = (k === 'all') ? data().length : cnt(data(), k);
    var b = el('button', 'tab', (k === 'all' ? 'All Applications' : LABEL[k]) + ' (' + n + ')');
    b.type = 'button';
    b.setAttribute('aria-pressed', filter === k);
    b.addEventListener('click', function(){ filter = k; selId = null; render(); });
    t.appendChild(b);
  });
}

function rows(){
  var q = query.toLowerCase();
  return data().filter(function(x){
    var hay = (x.name + ' ' + (x.city||'') + ' ' + (x.subs ? x.subs.join(' ') : '')).toLowerCase();
    return (filter === 'all' || x.status === filter) && (!q || hay.indexOf(q) > -1);
  });
}

function list(){
  var box = $('list');
  box.innerHTML = '';
  var r = rows();
  if(!r.length){
    box.appendChild(el('p', 'empty', 'No applications found in this section.'));
    return;
  }
  r.forEach(function(x){
    var b = el('button', 'item');
    b.type = 'button';
    if(x.id === selId) b.setAttribute('aria-current', 'true');
    var t = el('div', 'top2');
    t.appendChild(el('b', '', x.name));
    t.appendChild(el('span', 'badge ' + x.status, LABEL[x.status] || x.status));
    b.appendChild(t);

    b.addEventListener('click', function(){ selId = x.id; render(); });
    box.appendChild(b);
  });

    li.appendChild(el('span', '', p[0]));

    u.appendChild(li);
  });

  return d;

      ['Frequency', x.freq],
      ['Preferred time', x.time],
      ['Tutor gender', x.tgender]
    ]));
    d.appendChild(tags((x.subs || []).concat(x.goals || [])));
    d.appendChild(el('h3', '', 'Notes from student / parent'));
    d.appendChild(el('p', '', x.notes || 'No notes provided.'));
  }

  // Verification Checklist
  var cl = CHK[type === 'tutor' ? 'tutor' : 'req'];
  d.appendChild(el('h3', '', 'Verification Checklist'));
  cl.forEach(function(c){
    var l = el('label', 'chk');
    var k = document.createElement('input');
    k.type = 'checkbox';
    k.className = 'ck';
    k.checked = (x.status === 'approved');
    k.disabled = (x.status === 'approved');
    l.appendChild(k);
    l.appendChild(el('span', '', c));
    d.appendChild(l);
  });

  // Action Message
  d.appendChild(el('h3', '', 'Feedback Message (Required for Rejection or Requesting Changes)'));
  var ta = document.createElement('textarea');
  ta.id = 'reason';
  ta.placeholder = 'Provide clear feedback or rejection reason for the tutor dashboard...';
  ta.setAttribute('aria-label', 'Reason or feedback note');
  d.appendChild(ta);

  var m = el('div', 'msg');
  m.id = 'err';
  d.appendChild(m);

  var a = el('div', 'acts');

  function act(txt, cls, fn){
    var b = el('button', 'b ' + cls, txt);
    b.type = 'button';
    b.addEventListener('click', fn);
    a.appendChild(b);
  }

  // APPROVE ACTION
  act('Approve Profile', 'ok', function(){
    var checks = Array.prototype.slice.call(d.querySelectorAll('.ck'));
    var allChecked = checks.every(function(c){ return c.checked; });
    if(!allChecked && x.status !== 'approved'){
      m.textContent = 'Please confirm all checklist items before approving.';
      return;
    }

    if(confirm('Are you sure you want to approve ' + x.name + '? Their profile will become publicly visible immediately.')){
      decide(x, 'approved', 'Approved', ta.value.trim());
    }
  });

  // REJECT ACTION
  act('Reject Application', 'd', function(){
    var reason = ta.value.trim();
    if(!reason){
      m.textContent = 'Please provide a clear rejection reason explaining what needs correction.';
      ta.focus();
      return;
    }

    if(confirm('Are you sure you want to reject ' + x.name + '\'s application? The reason will be sent to their dashboard.')){
      decide(x, 'rejected', 'Rejected', reason);
    }
  });

  // MOVE BACK TO PENDING
  if(x.status === 'approved' || x.status === 'rejected'){
    act('Move to Pending Review', 'o', function(){
      if(confirm('Move ' + x.name + ' back to pending review? Their profile will be hidden from public search.')){
        decide(x, 'pending', 'Returned to Pending', 'Application reopened for review');
      }
    });
  }

  d.appendChild(a);

  // AUDIT TRAIL / LOGS
  d.appendChild(el('h3', '', 'Audit Trail & Activity History'));
  var lg = el('div', 'log');
  var tutorLogs = auditLogs.filter(function(l){ return l.id === x.id; });
  if(tutorLogs.length){
    tutorLogs.forEach(function(l){
      var logItem = el('p', '', 'â€¢ ' + l.action + ' by ' + l.admin + ' (' + l.timestamp + ')' + (l.note ? ' â€” â€œ' + l.note + 'â€' : ''));
      lg.appendChild(logItem);
    });
  } else {
    lg.appendChild(el('p', '', 'â€¢ Application submitted (' + (x.sent || 'Initial submission') + ')'));
    if(x.status === 'approved'){
      lg.appendChild(el('p', '', 'â€¢ Approved by admin@gmail.com (' + (x.reviewed_at ? new Date(x.reviewed_at).toLocaleDateString() : 'Verified') + ')'));
    } else if(x.status === 'rejected'){
      lg.appendChild(el('p', '', 'â€¢ Rejected by admin@gmail.com â€” Reason: ' + (x.rejection_reason || 'Needs corrections')));
    }
  }
  d.appendChild(lg);
}

function decide(x, s, verb, note){
  x.status = s;
  x.reviewed_at = new Date().toISOString();
  x.reviewed_by = 'admin@gmail.com';
  if(s === 'rejected'){
    x.rejection_reason = note || 'Profile requires corrections before approval.';
  } else if(s === 'approved'){
    x.rejection_reason = '';
  }

  logAction(x.id, x.name, verb, note);
  saveTutorsDb();

  // If the currently logged in tutor is this tutor, update their session
  try {
    var cur = JSON.parse(localStorage.getItem('modivs_current_tutor') || 'null');
    if(cur && cur.email === x.email){
      cur.status = s;
      cur.rejection_reason = x.rejection_reason;
      localStorage.setItem('modivs_current_tutor', JSON.stringify(cur));
    }
  } catch(err){}

  toast(verb + ' ' + x.name + (s === 'approved' ? '. Profile is now LIVE in public tutor search.' : '. Application status updated.'));
  render();
}

function render(){
  stats();
  tabs();
  list();
  detail();
}

$('sT').addEventListener('click', function(){ type = 'tutor'; filter = 'pending'; selId = null; render(); });
$('sR').addEventListener('click', function(){ type = 'req'; filter = 'pending'; selId = null; render(); });
$('q').addEventListener('input', function(e){ query = e.target.value.trim(); list(); });
$('out').addEventListener('click', function(){
  localStorage.removeItem('modivs_admin_session');
  toast('Logged out from Admin portal.');
  setTimeout(function(){ window.location.href = 'modivs-education.html#login'; }, 500);
});

// Auto-select first item if available
if(!selId && rows().length){
  selId = rows()[0].id;
}

render();
})();
</script>
</body>
</html>
