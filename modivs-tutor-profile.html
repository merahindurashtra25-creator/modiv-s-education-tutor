<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png" href="favicon.png">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Modiv’s Education – Tutor registration</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js" defer></script>
<script src="firebase-config.js" defer></script>

<style>
button,input,select,textarea{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif}

:root{--white:#fff;--mist:#f2f5f9;--line:#dfe5ee;--ink:#14213d;--muted:#5d6b82;--accent:#0e7c66;--accent-d:#0a5f4e;--tint:#e8f5f1;--err:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--white);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
.brand{font-weight:800;font-size:1.2rem;letter-spacing:-.01em;display:inline-flex;align-items:center;text-decoration:none}.brand img{height:44px;width:auto;display:block}.brand span{color:var(--accent)}
.shell{display:grid;grid-template-columns:70fr 30fr;min-height:100vh}
.main{padding:36px 28px 60px;display:flex;justify-content:center}
.col{width:100%;max-width:640px}
.topl{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.topl .links{display:flex;gap:8px;align-items:center}.topl .links a{color:var(--ink);text-decoration:none;font-weight:600;font-size:.88rem;border:1.5px solid var(--line);padding:6px 12px;border-radius:8px;background:#fff}.topl .links a:hover{border-color:var(--ink)}
.side{background:var(--ink);color:#fff;padding:36px 26px}
.side h2{font-size:1rem;margin:28px 0 14px;font-weight:600;color:#aab6cc}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:12px;align-items:center;padding:9px 0;color:#aab6cc;font-size:.95rem}
.steps i{width:26px;height:26px;border-radius:50%;border:1.5px solid #4a5a7a;display:grid;place-items:center;font-style:normal;font-size:.8rem;flex:none}
.steps li.on{color:#fff;font-weight:600}.steps li.on i{background:var(--accent);border-color:var(--accent)}
.steps li.done i{background:#fff;color:var(--ink);border-color:#fff}
.bar{height:6px;background:var(--mist);border-radius:99px;margin:18px 0 28px;overflow:hidden}
.bar div{height:100%;background:var(--accent);width:0}
h1{font-size:1.85rem;line-height:1.15;margin:0 0 6px;letter-spacing:-.02em;font-weight:800}
.sub{color:var(--muted);margin:0 0 20px}
label,.lab{display:block;font-weight:600;font-size:.9rem;margin:18px 0 6px}
.req{color:var(--err);font-weight:700;margin-left:2px}
.phone-row{display:flex;gap:8px}.phone-row select{width:auto;flex:0 0 132px;padding-left:8px;padding-right:4px}.phone-row input{flex:1;min-width:0}
.hint{font-weight:400;color:var(--muted);font-size:.82rem}
input[type=text],input[type=email],input[type=password],input[type=tel],input[type=number],select,textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:8px;background:var(--white)}
textarea{min-height:110px;resize:vertical}
:is(input,select,textarea,button,summary):focus-visible{outline:3px solid #7fd1bd;outline-offset:2px}
.bad{border-color:var(--err)!important}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}.chip input{position:absolute;opacity:0}
.chip span{display:block;padding:8px 14px;border:1.5px solid var(--line);border-radius:999px;cursor:pointer;font-size:.92rem}
.chip input:checked+span{background:var(--tint);border-color:var(--accent);font-weight:600}
.chip input:focus-visible+span{outline:3px solid #7fd1bd;outline-offset:2px}
.card{background:var(--mist);border-radius:12px;padding:16px;margin:12px 0;position:relative}
.card .rm{position:absolute;top:10px;right:10px;border:0;background:none;color:var(--muted);cursor:pointer;font-weight:600}
.add{border:1.5px dashed var(--accent);background:var(--white);color:var(--accent-d);font-weight:600;border-radius:8px;padding:10px 14px;cursor:pointer;margin-top:6px}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:32px}
.btn{padding:12px 22px;border-radius:8px;border:0;font-weight:600;cursor:pointer;background:var(--accent);color:#fff}
.btn:hover{background:var(--accent-d)}
.btn.ghost{background:var(--white);border:1.5px solid var(--line);color:var(--ink)}.btn.ghost:hover{background:var(--mist)}
.msg{color:var(--err);font-size:.88rem;min-height:1.3em;margin-top:14px}
.days{width:100%;border-collapse:collapse;font-size:.88rem}
.days th,.days td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--line)}
.days th:first-child,.days td:first-child{text-align:left;font-weight:600}
.days input{width:18px;height:18px;accent-color:var(--accent)}
.up{border:1.5px dashed var(--line);border-radius:12px;padding:18px;text-align:center;background:var(--white)}
.up small{display:block;color:var(--muted)}
.up input{margin-top:8px;max-width:100%}
.list{margin:8px 0 0;padding-left:18px;font-size:.88rem;color:var(--muted)}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:18px;font-weight:400}
.check input{margin-top:4px;accent-color:var(--accent)}
.prev{border:1px solid var(--line);border-radius:14px;padding:22px;margin-top:8px}
.prev h3{margin:0;font-size:1.3rem}
.prev p{margin:4px 0}
.tag{display:inline-block;background:var(--tint);color:var(--accent-d);font-size:.82rem;font-weight:600;padding:3px 10px;border-radius:99px;margin:2px 4px 2px 0}
.status{display:inline-block;background:#fff4d6;color:#7a5600;font-weight:600;font-size:.85rem;padding:4px 12px;border-radius:99px}
.done-box{text-align:center;padding:40px 0}
.dp-row{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.dp{width:96px;height:96px;border-radius:50%;background:var(--tint);color:var(--accent-d);display:grid;place-items:center;font-weight:800;font-size:1.6rem;overflow:hidden;border:2px solid var(--line);flex:none}
.dp img{width:100%;height:100%;object-fit:cover;display:block}
.dp.sm{width:64px;height:64px;font-size:1.1rem}
.dp-side{display:flex;flex-direction:column;gap:8px;align-items:flex-start;flex:1;min-width:200px}
.dp-btns{display:flex;gap:8px;flex-wrap:wrap}
.dp-btns .btn{padding:8px 16px;font-size:.9rem}
.dp-warn{color:#7a5600;font-size:.85rem;min-height:1.2em}
.prev-head{display:flex;gap:14px;align-items:center;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:8px;font-size:.9rem}
@media(max-width:820px){.shell{grid-template-columns:1fr}.side{display:none}.main{padding:24px 16px 60px}.two{grid-template-columns:1fr}}
</style>
<script src="modivs-places.js"></script>
</head>
<body>
<div class="shell">
 <main class="main"><div class="col">
  <div class="topl"><a href="modivs-home.html" class="brand"><img src="logo.png" alt="Modiv’s Education"></a><div class="links"><a href="modivs-home.html">Home</a><a href="modivs-tutor-dashboard.html">My dashboard</a></div></div>
  <div class="bar" aria-hidden="true"><div id="fill"></div></div>
  <form id="form" novalidate></form>
 </div></main>
 <aside class="side">
  <div class="brand">Tutor setup</div>
  <h2>Your progress</h2>
  <ol class="steps" id="steps"></ol>
 </aside>
</div>
<div class="toast hide" id="toast" role="status"></div>

<script>
(function(){
var STEPS=['Create account','About you','Qualifications','Experience','Subjects','Fees & availability','Verification','Review & submit'];
var SUBJECTS=['Mathematics','Science','Physics','Chemistry','Biology','English','Hindi','Punjabi','Sanskrit','Urdu','Social Science','History','Geography','Political Science','Economics','Accountancy','Business Studies','Computer Science','Coding / Programming','Environmental Science','French','German','Spanish','Music','Art','Dance','Yoga','Spoken English','Abacus / Vedic Maths'];
var LEVELS=['Primary (1–5)','Middle (6–8)','Secondary (9–10)','Senior secondary (11–12)','College / University','Competitive exams'];
var BOARDS=['CBSE','ICSE','PSEB','IB','IGCSE','State board'];
var LANGS=['English','Hindi','Punjabi','Urdu','Other'];
var DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],SLOTS=['Morning','Afternoon','Evening'];
var D={email:'',pass:'',role:'Tutor',name:'',phone:'',altPhone:'',whatsapp:'',waSame:false,photo:'',photoBlur:false,city:'',area:'',gender:'',dob:'',headline:'',bio:'',langs:[],
 quals:[{degree:'',inst:'',field:'',year:''}],exp:[{title:'',org:'',from:'',to:'',desc:''}],totalYears:'',
 subjects:[],levels:[],boards:[],modes:['Online'],formats:['1-on-1 Individual tuition'],groupFee:'',maxBatch:'6 students',travel:'',fee:'',trial:'',avail:{},notice:'',
 idType:'',idName:'',certName:'',agree:false};

try {
  var savedTutor = JSON.parse(localStorage.getItem('modivs_current_tutor') || 'null');
  if(savedTutor && savedTutor.name){
    Object.assign(D, savedTutor);
  }
} catch(e){}

// Account is created on the Create Account page; prefill from it
try {
  var au = JSON.parse(localStorage.getItem('modivs_auth_user') || 'null');
  if(!au || au.role !== 'Tutor'){ window.location.replace('modivs-education.html#tutor-signup'); }
  else {
    if(!D.email) D.email = au.email || '';
    if(!D.name) D.name = au.name || '';
    if(!D.pass){
      var uu = JSON.parse(localStorage.getItem('modivs_users') || '[]').filter(function(u){ return u.email === String(au.email).toLowerCase(); })[0];
      if(uu) D.pass = uu.pass || '';
    }
  }
} catch(e){}
var EDIT=/[?&]edit=1/.test(location.search)&&!!(D.name&&D.email);
var ORIG=JSON.parse(JSON.stringify({photo:D.photo,name:D.name,idType:D.idType,idName:D.idName,certName:D.certName,status:D.status||''}));
var step=1,submitted=false,toastT,finalStatus='pending';
var f=document.getElementById('form');

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var STAR=' <span class="req" aria-hidden="true">*</span>';
var PH=/^[+0-9\s-]{10,15}$/;
var COUNTRIES=[['India','+91'],['United States / Canada','+1'],['United Kingdom','+44'],['United Arab Emirates','+971'],['Saudi Arabia','+966'],['Qatar','+974'],['Kuwait','+965'],['Oman','+968'],['Bahrain','+973'],['Singapore','+65'],['Malaysia','+60'],['Australia','+61'],['New Zealand','+64'],['Nepal','+977'],['Bhutan','+975'],['Bangladesh','+880'],['Sri Lanka','+94'],['Pakistan','+92'],['Afghanistan','+93'],['Germany','+49'],['France','+33'],['Italy','+39'],['Spain','+34'],['Netherlands','+31'],['Ireland','+353'],['Switzerland','+41'],['Sweden','+46'],['Russia','+7'],['China','+86'],['Japan','+81'],['South Korea','+82'],['Hong Kong','+852'],['Thailand','+66'],['Indonesia','+62'],['Philippines','+63'],['South Africa','+27'],['Nigeria','+234'],['Kenya','+254'],['Egypt','+20'],['Turkey','+90'],['Brazil','+55'],['Mexico','+52']];
function splitPhone(p){p=String(p||'').trim();var raw=p.replace(/[\s-]/g,'');
 if(raw.charAt(0)==='+'){var best='';COUNTRIES.forEach(function(c){if(raw.indexOf(c[1])===0&&c[1].length>best.length)best=c[1]});
  if(best)return {cc:best,num:raw.slice(best.length).replace(/\D/g,'')}}
 return {cc:'+91',num:raw.replace(/\D/g,'')}}
function phoneField(id,label,val,hint,dis){var s=splitPhone(val),d=dis?' disabled':'';
 return '<label for="'+id+'">'+label+(hint?' <span class="hint">'+hint+'</span>':'')+'</label><div class="phone-row"><select id="'+id+'_cc" aria-label="Country code"'+d+'>'+COUNTRIES.map(function(c){return '<option value="'+c[1]+'"'+(c[1]===s.cc?' selected':'')+'>'+c[1]+' '+esc(c[0])+'</option>'}).join('')+'</select><input id="'+id+'" type="tel" inputmode="numeric" autocomplete="tel-national" value="'+esc(s.num)+'" placeholder="Phone number"'+d+'></div>'}
function getPhone(id){var e=document.getElementById(id),c=document.getElementById(id+'_cc'),n=e?e.value.replace(/\D/g,''):'';return n?(c?c.value:'+91')+' '+n:''}
function validPhone(p){var m=/^(\+\d{1,4}) (\d+)$/.exec(p||'');if(!m)return false;if(m[1]==='+91')return /^[6-9]\d{9}$/.test(m[2]);return m[2].length>=6&&m[2].length<=14}
function phoneMsg(p,what){var m=/^(\+\d{1,4})/.exec(p||'');return (m&&m[1]==='+91')?'Enter a valid 10-digit '+what+' (Indian numbers start with 6, 7, 8 or 9).':'Enter a valid '+what+' for the selected country (6–14 digits).'}
function samePhone(a,b){return String(a).replace(/\D/g,'')===String(b).replace(/\D/g,'')}
function syncWa(){var c=document.getElementById('waSame'),w=document.getElementById('whatsapp'),wc=document.getElementById('whatsapp_cc'),p=document.getElementById('phone'),pc=document.getElementById('phone_cc');
 if(!c||!w||!wc||!p||!pc)return;if(c.checked){w.value=p.value.replace(/\D/g,'');wc.value=pc.value}w.disabled=wc.disabled=c.checked}

function digits(x){return String(x||'').replace(/\D/g,'').slice(-10)}
function initials(n){return String(n||'').split(' ').filter(Boolean).map(function(w){return w[0]}).slice(0,2).join('').toUpperCase()||'TR'}
function dpInner(){return D.photo?'<img src="'+esc(D.photo)+'" alt="Your profile photo">':esc(initials(D.name))}
function toast(t){var e=document.getElementById('toast');e.textContent=t;e.classList.remove('hide');clearTimeout(toastT);toastT=setTimeout(function(){e.classList.add('hide')},2400)}
function cityList(){var o={};['modivs_tutors_db','modivs_submitted_tutors'].forEach(function(k){try{(JSON.parse(localStorage.getItem(k)||'[]')||[]).forEach(function(t){if(t&&t.status==='approved'&&t.city&&!t.is_demo)o[String(t.city).trim()]=1})}catch(e){}});return Object.keys(o).sort()}
function normCity(c){return String(c||'').replace(/\s+/g,' ').trim().toLowerCase().replace(/(^|[\s-])([a-z])/g,function(m,a,b){return a+b.toUpperCase()})}
function areaList(city){var o={},c=String(city||'').trim().toLowerCase();['modivs_tutors_db','modivs_submitted_tutors'].forEach(function(k){try{(JSON.parse(localStorage.getItem(k)||'[]')||[]).forEach(function(t){if(t&&t.status==='approved'&&!t.is_demo&&String(t.city||'').trim().toLowerCase()===c){[t.area].concat(String(t.travel||'').split(/[,;\n\/]+/)).forEach(function(a){a=normCity(a);if(a)o[a]=1})}})}catch(e){}});return Object.keys(o).sort()}
function areaField(val,city){return '<label for="area">Area / locality'+STAR+' <span class="hint">where you live or mainly teach; pick your city first</span></label>'+ModivsPlaces.fieldHTML({id:'area',kind:'area',val:val,city:city})}
/* city change refills the area dropdown (handled by modivs-places.js) */
function cityField(val){return '<label for="city">City'+STAR+' <span class="hint">shown on the site after admin approval</span></label>'+ModivsPlaces.fieldHTML({id:'city',kind:'city',val:val,areaId:'area'})}
function field(id,label,val,type,hint,ph){return '<label for="'+id+'">'+label+(hint?' <span class="hint">'+hint+'</span>':'')+'</label><input id="'+id+'" type="'+(type||'text')+'" value="'+esc(val)+'"'+(ph?' placeholder="'+esc(ph)+'"':'')+'>'}
function chips(name,list,sel){return '<div class="chips" role="group">'+list.map(function(x,i){return '<label class="chip" style="margin:0;font-weight:400"><input type="checkbox" data-group="'+name+'" value="'+esc(x)+'"'+(sel.indexOf(x)>-1?' checked':'')+'><span>'+esc(x)+'</span></label>'}).join('')+'</div>'}
function sel(id,label,val,opts){return '<label for="'+id+'">'+label+'</label><select id="'+id+'"><option value="">Select</option>'+opts.map(function(o){return '<option'+(o===val?' selected':'')+'>'+esc(o)+'</option>'}).join('')+'</select>'}
function nav(last){return '<div class="nav"><button type="button" class="btn ghost" data-act="back"'+(step===1?' style="visibility:hidden"':'')+'>Back</button><button type="submit" class="btn">'+(last?(EDIT?'Save changes':'Submit for verification'):(step===0?'Create account':'Save and continue'))+'</button></div>'}

var views=[
function(){return '<h1>Create your tutor account</h1><p class="sub">Start with your login details. You’ll build your profile next.</p>'+
 field('email','Email'+STAR,D.email,'email')+field('pass','Password'+STAR,D.pass,'password','at least 8 characters')+field('pass2','Confirm password'+STAR,'','password')+'<div class="msg" id="msg" role="alert"></div>'+nav()+'<p class="sub" style="margin-top:16px;font-size:0.9rem;">Already registered? <a href="modivs-education.html#login" style="color:var(--accent-d);font-weight:600;">Log in</a> · <a href="modivs-tutor-dashboard.html" style="color:var(--accent-d);font-weight:600;">Tutor Dashboard</a></p>'},
function(){return '<h1>About you</h1><p class="sub">Students and parents see this first. Fields marked <span class="req">*</span> are required.</p>'+
 '<div class="lab">Profile photo'+STAR+' <span class="hint">shown on your public profile</span></div>'+
 '<div class="dp-row"><div class="dp" id="dpBox">'+dpInner()+'</div><div class="dp-side"><input id="photoFile" type="file" accept="image/jpeg,image/png,image/webp" class="hide"><div class="dp-btns"><button type="button" class="btn ghost" data-act="pickPhoto">'+(D.photo?'Change photo':'Upload photo')+'</button>'+(D.photo?'<button type="button" class="btn ghost" data-act="removePhoto">Remove</button>':'')+'</div><span class="hint">Use a clear, front-facing photo of your face in good light. No group photos, sunglasses or filters. JPG, PNG or WebP, up to 5 MB.</span><div class="dp-warn" id="dpWarn" role="status">'+(D.photo&&D.photoBlur?'This photo looks a little blurry. A sharper photo is approved faster.':'')+'</div></div></div>'+
 field('name','Full name'+STAR,D.name)+
 phoneField('whatsapp','WhatsApp number'+STAR,D.waSame?D.phone:D.whatsapp,'',D.waSame)+'<label class="check" style="margin-top:8px"><input type="checkbox" id="waSame"'+(D.waSame?' checked':'')+'><span>Same as my mobile number</span></label>'+
 '<div class="two"><div>'+phoneField('phone','Mobile number'+STAR,D.phone)+'</div><div>'+phoneField('altPhone','Alternate phone number'+STAR,D.altPhone)+'</div></div>'+
 cityField(D.city)+areaField(D.area,D.city)+
 '<div class="two"><div>'+sel('gender','Gender'+STAR,D.gender,['Female','Male','Other','Prefer not to say'])+'</div><div>'+field('dob','Date of birth'+STAR,D.dob,'date')+'</div></div>'+
 field('headline','Profile headline'+STAR,D.headline,'text','one line','e.g. Maths tutor for classes 9–12 with 8 years’ experience')+
 '<label for="bio">About you'+STAR+' <span class="hint">at least 80 characters</span></label><textarea id="bio">'+esc(D.bio)+'</textarea>'+
 '<div class="lab">Languages you teach in'+STAR+'</div>'+chips('langs',LANGS,D.langs)+'<div class="msg" id="msg" role="alert"></div>'+nav()},
function(){return '<h1>Qualifications</h1><p class="sub">Add your highest qualification first.</p><div id="quals">'+D.quals.map(function(q,i){return '<div class="card">'+(D.quals.length>1?'<button type="button" class="rm" data-rm="quals" data-i="'+i+'">Remove</button>':'')+
 field('q_degree'+i,'Degree or certificate'+STAR,q.degree,'text','','e.g. M.Sc. Mathematics')+field('q_inst'+i,'Institution'+STAR,q.inst)+'<div class="two"><div>'+field('q_field'+i,'Field of study'+STAR,q.field)+'</div><div>'+field('q_year'+i,'Year completed'+STAR,q.year,'number')+'</div></div></div>'}).join('')+'</div>'+
 '<button type="button" class="add" data-add="quals">+ Add qualification</button><div class="msg" id="msg" role="alert"></div>'+nav()},
function(){return '<h1>Teaching experience</h1><p class="sub">Skip the entries if you are a first-time tutor.</p>'+field('totalYears','Total years of teaching'+STAR,D.totalYears,'number')+'<div id="exp">'+D.exp.map(function(x,i){return '<div class="card"><button type="button" class="rm" data-rm="exp" data-i="'+i+'">Remove</button>'+
 field('e_title'+i,'Role',x.title,'text','','e.g. Mathematics teacher')+field('e_org'+i,'School, institute or “Private tutoring”',x.org)+'<div class="two"><div>'+field('e_from'+i,'From (year)',x.from,'number')+'</div><div>'+field('e_to'+i,'To (year or “Present”)',x.to)+'</div></div>'+
 '<label for="e_desc'+i+'">What you did</label><textarea id="e_desc'+i+'" style="min-height:70px">'+esc(x.desc)+'</textarea></div>'}).join('')+'</div>'+
 '<button type="button" class="add" data-add="exp">+ Add experience</button><div class="msg" id="msg" role="alert"></div>'+nav()},
function(){return '<h1>Subjects you teach</h1><p class="sub">Choose everything you are confident teaching.</p><div class="lab">Subjects'+STAR+'</div>'+chips('subjects',allSubjects(),D.subjects)+

function sharpness(cv,S){ // variance of Laplacian on a 200px greyscale copy; low = blurry
 var T=200,c=document.createElement('canvas');c.width=c.height=T;var x=c.getContext('2d');x.drawImage(cv,0,0,S,S,0,0,T,T);
 var d=x.getImageData(0,0,T,T).data,g=new Float32Array(T*T),i,j;
 for(i=0;i<T*T;i++)g[i]=.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2];
 var sum=0,sq=0,n=0,l;
 for(i=1;i<T-1;i++)for(j=1;j<T-1;j++){l=g[(i-1)*T+j]+g[(i+1)*T+j]+g[i*T+j-1]+g[i*T+j+1]-4*g[i*T+j];sum+=l;sq+=l*l;n++}
 return sq/n-(sum/n)*(sum/n)}
function handlePhoto(file){

 if(file.size>5242880){toast('Photo must be 5 MB or smaller.');return}
 var fr=new FileReader();
 fr.onerror=function(){toast('Could not read that file. Try another photo.')};
 fr.onload=function(){var img=new Image();
  img.onerror=function(){toast('That file is not a valid image.')};
  img.onload=function(){
   if(Math.min(img.width,img.height)<200){toast('Photo is too small. Use at least 200 × 200 pixels.');return}
   var S=400,c=document.createElement('canvas');c.width=c.height=S;var x=c.getContext('2d');
   var m=Math.min(img.width,img.height);x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,S,S);
   var blur=sharpness(c,S)<60;
   readLoose();D.photo=c.toDataURL('image/jpeg',0.85);D.photoBlur=blur;render();toast('Photo added')};
  img.src=fr.result};
 fr.readAsDataURL(file)}

 if(step===1){readAbout()}
 if(step===4){D.subjects=readSubjects();D.levels=group('levels');D.boards=group('boards')}
 if(step===5){D.modes=group('modes');D.formats=group('formats');D.fee=v('fee');D.groupFee=v('groupFee');D.maxBatch=v('maxBatch');D.trial=v('trial');D.travel=v('travel');D.notice=v('notice');D.avail={};f.querySelectorAll('input[data-avail]').forEach(function(c){if(c.checked)D.avail[c.getAttribute('data-avail')]=1})}
}
render();
})();
