<style>
button,input,select,textarea{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif}

:root{--white:#fff;--mist:#f2f5f9;--line:#dfe5ee;--ink:#14213d;--muted:#5d6b82;--accent:#0e7c66;--accent-d:#0a5f4e;--tint:#e8f5f1;--err:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--white);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.hide{display:none!important}
.brand{font-weight:800;font-size:1.2rem;letter-spacing:-.01em;display:inline-flex;align-items:center;text-decoration:none}.brand img{height:64px;width:auto;display:block}.brand span{color:var(--accent)}
.shell{display:grid;grid-template-columns:70fr 30fr;min-height:100vh}
.main{padding:36px 28px 60px;display:flex;justify-content:center}
.col{width:100%;max-width:640px}
.topl{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.topl .links{display:flex;gap:8px;align-items:center}.topl .links a{color:var(--ink);text-decoration:none;font-weight:600;font-size:.88rem;border:1.5px solid var(--line);padding:6px 12px;border-radius:8px;background:#fff}.topl .links a:hover{border-color:var(--ink)}
.side{background:var(--ink);color:#fff;padding:36px 26px}
.side h2{font-size:1rem;margin:28px 0 14px;font-weight:600;color:#aab6cc}
.shell{overflow:hidden}
.side{position:relative;overflow:hidden;isolation:isolate;background:linear-gradient(160deg,#1a2035 0%,#14213d 55%,#0f3a4a 100%);background-size:200% 200%}
.side::before,.side::after{content:"";position:absolute;border-radius:50%;z-index:-1;pointer-events:none}
.side::before{width:260px;height:260px;top:-70px;right:-80px;background:radial-gradient(circle at 30% 30%,#fabd4e,rgba(250,189,78,0) 70%);opacity:.5}
.side::after{width:300px;height:300px;bottom:-120px;left:-110px;background:radial-gradient(circle at 60% 40%,#2fb59a,rgba(47,181,154,0) 70%);opacity:.4}
@media(prefers-reduced-motion:no-preference){
 .side{animation:sideSlide 1.05s cubic-bezier(.22,1,.36,1) both,sideShift 14s ease-in-out 1.1s infinite alternate}
 .side::before{animation:orbFloat 7s ease-in-out infinite alternate}
 .side::after{animation:orbFloat 9s ease-in-out -3s infinite alternate-reverse}
 .side>*{animation:sideRise .8s cubic-bezier(.22,1,.36,1) both}
 .side>*:nth-child(1){animation-delay:.6s}.side>*:nth-child(2){animation-delay:.8s}.side>*:nth-child(3){animation-delay:1s}
 .col{animation:cardFade .8s .1s ease-out both}
}
@keyframes sideSlide{0%{transform:translateX(105%);opacity:0;border-top-left-radius:120px;border-bottom-left-radius:120px}60%{opacity:1}100%{transform:none;opacity:1;border-top-left-radius:0;border-bottom-left-radius:0}}
@keyframes sideShift{from{background-position:0 0}to{background-position:100% 100%}}
@keyframes orbFloat{from{transform:translate(0,0) scale(1)}to{transform:translate(-28px,34px) scale(1.18)}}
@keyframes sideRise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes cardFade{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:12px;align-items:center;padding:9px 0;color:#aab6cc;font-size:.95rem}
.steps i{width:26px;height:26px;border-radius:50%;border:1.5px solid #4a5a7a;display:grid;place-items:center;font-style:normal;font-size:.8rem;flex:none}
.steps li.on{color:#fff;font-weight:600}.steps li.on i{background:var(--accent);border-color:var(--accent)}
.steps li.done i{background:#fff;color:var(--ink);border-color:#fff}
.bar{height:6px;background:var(--mist);border-radius:99px;margin:18px 0 28px;overflow:hidden}
.bar div{height:100%;background:var(--accent);width:0}
h1{font-size:1.85rem;line-height:1.15;margin:0 0 6px;letter-spacing:-.02em;font-weight:800}
.sub{color:var(--muted);margin:0 0 20px}
label,.lab{display:block;font-weight:600;font-size:.9rem;margin:18px 0 6px}
.hint{font-weight:400;color:var(--muted);font-size:.82rem}
input[type=text],input[type=email],input[type=password],input[type=tel],input[type=number],input[type=date],select,textarea{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:8px;background:var(--white)}
textarea{min-height:100px;resize:vertical}
:is(input,select,textarea,button):focus-visible{outline:3px solid #7fd1bd;outline-offset:2px}
.bad{border-color:var(--err)!important}
.avs.bad{outline:2px solid var(--err);outline-offset:4px;border-radius:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;margin:0!important;font-weight:400!important}.chip input{position:absolute;opacity:0}
.chip span{display:block;padding:8px 14px;border:1.5px solid var(--line);border-radius:999px;cursor:pointer;font-size:.92rem}
.chip input:checked+span{background:var(--tint);border-color:var(--accent);font-weight:600}
.chip input:focus-visible+span{outline:3px solid #7fd1bd;outline-offset:2px}
.avs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
.av-opt{position:relative;margin:0!important;font-weight:400!important}
.av-opt input{position:absolute;opacity:0}
.av-opt .avc{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 10px;border:1.5px solid var(--line);border-radius:14px;cursor:pointer;background:#fff;transition:border-color .15s,box-shadow .15s,transform .15s}
.av-opt .avc img{width:92px;height:92px;border-radius:50%;display:block;box-shadow:0 2px 8px rgba(20,33,61,.15)}
.av-opt .avc b{font-size:.95rem}
.av-opt:hover .avc{transform:translateY(-2px);border-color:var(--accent)}
.av-opt input:checked+.avc{border-color:var(--accent);background:var(--tint);box-shadow:0 0 0 3px rgba(14,124,102,.18)}
.av-opt input:checked+.avc b::after{content:" ✓";color:var(--accent-d)}
.av-opt input:focus-visible+.avc{outline:3px solid #7fd1bd;outline-offset:2px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.roles .chip span{border-radius:10px;padding:14px;text-align:center;font-weight:600}
.roles .chip small{display:block;font-weight:400;color:var(--muted)}
.card{background:var(--mist);border-radius:12px;padding:16px;margin:12px 0;position:relative}
.card .rm{position:absolute;top:10px;right:10px;border:0;background:none;color:var(--muted);cursor:pointer;font-weight:600}
.add{border:1.5px dashed var(--accent);background:var(--white);color:var(--accent-d);font-weight:600;border-radius:8px;padding:10px 14px;cursor:pointer;margin-top:6px}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:32px}
.btn{padding:12px 22px;border-radius:8px;border:0;font-weight:600;cursor:pointer;background:var(--accent);color:#fff}
.btn:hover{background:var(--accent-d)}
.btn.ghost{background:var(--white);border:1.5px solid var(--line);color:var(--ink)}.btn.ghost:hover{background:var(--mist)}
.msg{color:var(--err);font-size:.88rem;min-height:1.3em;margin-top:14px}
.check{display:flex;gap:10px;align-items:flex-start;margin-top:18px;font-weight:400}
.check input{margin-top:4px;accent-color:var(--accent)}
.prev{border:1px solid var(--line);border-radius:14px;padding:22px;margin-top:8px}
.prev h3{margin:0;font-size:1.3rem}.prev p{margin:6px 0}
.tag{display:inline-block;background:var(--tint);color:var(--accent-d);font-size:.82rem;font-weight:600;padding:3px 10px;border-radius:99px;margin:2px 4px 2px 0}
.status{display:inline-block;background:var(--tint);color:var(--accent-d);font-weight:600;font-size:.85rem;padding:4px 12px;border-radius:99px}
.done-box{text-align:center;padding:40px 0}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:8px;font-size:.9rem}
@media(max-width:820px){.shell{grid-template-columns:1fr}.side{display:none}.main{padding:24px 16px 60px}.two{grid-template-columns:1fr}}
</style>
<style>
.bd-wrap{max-width:760px;margin:0 auto;padding:34px 18px 60px}
.bd-hero{text-align:center;margin-bottom:8px}.bd-hero .hey{font-weight:700;color:var(--accent-d);margin:0}
.bd-hero h1{font-size:1.7rem}
.tutorbox{background:var(--tint);border:1.5px solid var(--accent);border-radius:12px;padding:12px 16px;margin:14px 0;font-size:.95rem}
.qs{border-top:1px solid var(--line);margin-top:22px;padding-top:4px}

.rg{display:flex;flex-wrap:wrap;gap:6px 22px}
.rg label{display:flex;align-items:center;gap:8px;margin:0;font-weight:400;cursor:pointer}
.rg input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.bd-wrap .btn{width:100%;margin-top:26px;padding:14px;font-size:1rem}
.ok{text-align:center;padding:40px 0}
</style>

<main class="bd-wrap">
 <div class="bd-hero"><p class="hey">Hey ! Student/Parent</p><h1>Post Your Tuition Requirement</h1><p class="sub">Just answer a few quick questions 👇</p></div>
 <div id="tutorBox" class="tutorbox hide"></div>
 <form id="form" novalidate></form>
</main>
<div class="toast hide" id="toast" role="status"></div>
<script>
(function(){
var CLASSES=['Kindergarten ( LKG-UKG)','Class 1','Class 2','Class 3','Class 4','Class 5','Class 6','Class 7','Class 8','Class 9','Class 10','Class 11','Class 12','College / University','Competitive Level'];
var BOARDS=['CBSE','ICSE','IGCSE (Cambridge)','IB (International Baccalaureate)','NIOS (Open Schooling)','State Board','Other'];
var DAYS=['Monday To Saturday','Monday To Friday','Alternative Days','On Weekends','On Sundays','Regular Days'];
var TIMES=['Morning','Afternoon','Evening','Flexible'];
var FEES=[];for(var r=100;r<=2000;r+=50)FEES.push('Rs '+r+' / hour');
var f=document.getElementById('form');
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function jget(k,d){try{var v=JSON.parse(localStorage.getItem(k)||'null');return v==null?d:v}catch(e){return d}}
function sel(id,label,opts,ph){return '<label for="'+id+'">'+label+'</label><select id="'+id+'"><option value="">'+(ph||'- Select -')+'</option>'+opts.map(function(o){return '<option>'+esc(o)+'</option>'}).join('')+'</select>'}
function radios(name,opts){return '<div class="rg" role="radiogroup">'+opts.map(function(o){return '<label><input type="radio" name="'+name+'" value="'+esc(o)+'"> '+esc(o)+'</label>'}).join('')+'</div>'}
function boxes(name,opts){return '<div class="rg" role="group">'+opts.map(function(o){return '<label><input type="checkbox" data-group="'+name+'" value="'+esc(o)+'"> '+esc(o)+'</label>'}).join('')+'</div>'}

function avatarPicker(){return '<div class="lab" id="avatarLab">Choose your (or your child’s) avatar <span class="hint">shown on your requirement</span></div><div class="avs" role="radiogroup" aria-labelledby="avatarLab" id="avatarBox">'+['male','female'].map(function(k){return '<label class="av-opt"><input type="radio" name="avatar" value="'+k+'"><span class="avc"><img src="'+ModivsAvatars.src(k)+'" alt="'+(k==='male'?'Boy':'Girl')+' avatar"><b>'+(k==='male'?'Boy':'Girl')+'</b></span></label>'}).join('')+'</div>'}
/* ?tutor=3349 : the tutor the student wants a demo with */
var tid=(new URLSearchParams(location.search).get('tutor')||'').trim(),tutor=null;
if(tid){
 ['modivs_tutors_db','modivs_submitted_tutors'].forEach(function(k){(jget(k,[])||[]).forEach(function(t){if(t&&!tutor&&String(t.id)===tid)tutor=t})});
 var tb=document.getElementById('tutorBox');tb.classList.remove('hide');
 tb.innerHTML='Booking a demo class with <b>'+esc(tutor&&tutor.name?tutor.name:'Tutor #'+tid)+'</b>'+(tutor&&tutor.name?' <span class="hint">(ID '+esc(tid)+')</span>':'')+'.';
}

f.innerHTML=
 '<div class="qs"><div class="lab">Which Category Of subject(s) do you need help with? <span class="hint">tick the categories, then choose subjects</span></div>'+ModivsSubjects.picker('subjects',[])+
 '<label for="otherSub">Any Other Subject <span class="hint">optional</span></label><input id="otherSub" type="text" placeholder="e.g. Sanskrit grammar"></div>'+
 '<div class="qs"><div class="two"><div>'+sel('cls','Select Learning Class / Academic Level',CLASSES)+'</div><div>'+sel('board','Which board or curriculum do you follow?',BOARDS,'Select your board or curriculum')+'</div></div></div>'+
 '<div class="qs"><div class="lab">Choose Tutor Type Need</div>'+radios('ttype',['Home Tutor','Online Tutor'])+
 '<div class="lab">Do you have a tutor gender preference?</div>'+radios('tgender',['Female','Male','No Preference'])+
 '<div class="lab">Preferred Mode of Learning</div>'+boxes('modes',['Student’s Home','Tutor’s Place','Online (Skype or Zoom Class)'])+'<div class="lab">Tuition format <span class="hint">works for online and offline classes</span></div>'+boxes('formats',['1-on-1 Individual tuition','Group tuition (Small batch)'])+'<div id="addrBox" class="hide"><label for="addr">Detailed address <span class="hint">house no., street, area, landmark, pincode. Kept private, never shown publicly</span></label><textarea id="addr" style="min-height:80px"></textarea></div></div>'+
 '<div class="qs"><div class="two"><div>'+sel('days','How many days per week do you want classes?',DAYS,'Select Class Days')+'</div><div>'+sel('time','What time suits you best for classes?',TIMES,'Choose a time slot')+'</div></div>'+
 '<div class="lab">Would you like a free demo class?</div>'+radios('demo',['Yes','No'])+sel('fee','Fee Range',FEES)+'</div>'+
 '<div class="qs"><label for="name">What’s your name?</label><input id="name" type="text" autocomplete="name">'+avatarPicker()+
 '<div class="two"><div><label for="phone">Mobile / WhatsApp Number <span class="hint">kept private, never shown publicly</span></label><input id="phone" type="tel" autocomplete="tel"></div><div><label for="email">Email address</label><input id="email" type="email" autocomplete="email"></div></div>'+
  '<label for="needs">Tell us more about your learning needs</label><textarea id="needs"></textarea>'+
  '<label for="city">Where are you located?</label>'+ModivsPlaces.fieldHTML({id:'city',kind:'city',val:''})+'</div>'+
 '<div class="msg" id="msg" role="alert"></div><button type="submit" class="btn">Post Requirement</button>'+
 '<p class="sub" style="margin-top:16px;font-size:.9rem;text-align:center">Want a dashboard to track tutors? <a href="modivs-student-signup.html" style="color:var(--accent-d);font-weight:600">Sign up</a> · <a href="modivs-education.html#login" style="color:var(--accent-d);font-weight:600">Log in</a> · <a href="modivs-education.html#tutor-signup" style="color:var(--accent-d);font-weight:600">Tutor sign up</a></p>';

function syncAddr(){var m=group('modes'),need=rad('ttype')==='Home Tutor'||m.some(function(x){return x.indexOf('Online')<0});document.getElementById('addrBox').classList.toggle('hide',!need)}
f.addEventListener('change',syncAddr);
function v(id){var e=document.getElementById(id);return e?e.value.trim():''}
function group(n){return [].map.call(f.querySelectorAll('input[data-group="'+n+'"]:checked'),function(x){return x.value})}
function rad(n){var e=f.querySelector('input[name="'+n+'"]:checked');return e?e.value:''}
function fail(id,m){var e=document.getElementById(id);if(e){e.classList.add('bad');if(e.focus)e.focus()}document.getElementById('msg').textContent=m;return false}

f.addEventListener('submit',function(e){
 e.preventDefault();f.querySelectorAll('.bad').forEach(function(x){x.classList.remove('bad')});
 var subs=group('subjects'),other=v('otherSub');if(other)other.split(',').forEach(function(x){x=x.trim();if(x&&subs.indexOf(x)<0)subs.push(x)});
 var modes=group('modes'),email=v('email').toLowerCase(),pass='',phone=v('phone'),city=ModivsPlaces.canon('city',v('city'));
 if(!subs.length)return fail('otherSub','Choose at least one subject, or type one in “Any Other Subject”.');
 if(!v('cls'))return fail('cls','Select the class / academic level.');
 if(!v('board'))return fail('board','Select your board or curriculum.');
 if(!rad('ttype'))return fail('msg','Choose the tutor type you need (Home or Online).');
 if(!rad('tgender'))return fail('msg','Choose a tutor gender preference.');
 if(!modes.length)return fail('msg','Choose at least one preferred mode of learning.');
 var formats=group('formats'),needAddr=rad('ttype')==='Home Tutor'||modes.some(function(m){return m.indexOf('Online')<0});
 if(!formats.length)return fail('msg','Choose a tuition format (1-on-1 or group).');
 if(needAddr&&!v('addr'))return fail('addr','Enter your detailed address for in-person classes.');
 if(!v('days'))return fail('days','Select how many days per week you want classes.');
 if(!v('time'))return fail('time','Select the time that suits you best.');
 if(!rad('demo'))return fail('msg','Tell us if you would like a free demo class.');
 if(!v('fee'))return fail('fee','Select your fee range.');
 if(!v('name'))return fail('name','Enter your name.');
 if(!rad('avatar'))return fail('avatarBox','Choose a boy or girl avatar for your requirement.');
 if(!/^[+0-9\s-]{10,15}$/.test(phone))return fail('phone','Enter a valid mobile / WhatsApp number.');
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return fail('email','Enter a valid email address.');
   if(!city)return fail('city','Select where you are located.');
 var rad0=rad('demo')==='Yes',fee=v('fee').replace('Rs ','₹'),stamp=new Date().toISOString();
 var req={id:'stu_'+Date.now(),name:v('name'),parentName:v('name'),email:email,phone:phone,city:city,cls:v('cls'),board:v('board'),school:'',avatar:rad('avatar'),formats:formats,
  subs:subs,level:'Average',goals:['Demo class'],notes:v('needs'),mode:modes,tutorType:rad('ttype'),tutorGender:rad('tgender'),
  budget:fee,freq:v('days'),timeSlot:v('time'),freeDemo:rad('demo'),address:needAddr?v('addr'):'',tutorId:tid,
  status:'pending',sent:'Just now',registered_at:stamp,by:'Student / Parent'};
 try{
  var db=jget('modivs_students_db',[]),i=email?db.findIndex(function(s){return s.email===email}):-1;
  if(i>=0)db[i]=req;else db.unshift(req);localStorage.setItem('modivs_students_db',JSON.stringify(db));
  var leads=jget('modivs_active_leads',[]),lead=Object.assign({},req,{status:'active'});leads.unshift(lead);localStorage.setItem('modivs_active_leads',JSON.stringify(leads));
  var dr=jget('modivs_demo_requests',[]);dr.unshift({id:req.id,tutorId:tid,student:req.name,phone:phone,email:email,subs:subs,city:city,requested_at:stamp});localStorage.setItem('modivs_demo_requests',JSON.stringify(dr));
  if(window.EducationBFirebase){var A=window.EducationBFirebase.auth,F=window.EducationBFirebase.db;
   if(A&&email&&pass&&!A.currentUser)A.createUserWithEmailAndPassword(email,pass).then(function(r){if(r&&r.user)r.user.updateProfile({displayName:req.name})}).catch(function(){});
   if(F){F.collection('students').doc(req.id).set(req,{merge:true}).catch(function(){});F.collection('leads').doc(req.id).set(lead,{merge:true}).catch(function(){});F.collection('demoRequests').doc(req.id).set({tutorId:tid,studentId:req.id,name:req.name,phone:phone,email:email,subs:subs,city:city,requested_at:stamp}).catch(function(){})}}
 }catch(err){}
 f.innerHTML='<div class="ok"><h1>Requirement posted!</h1><p class="sub">Thanks, '+esc(req.name.split(' ')[0])+'. Verified tutors can now see your requirement, and our team will call or WhatsApp you on '+esc(phone)+(rad0?' about your free demo class':'')+(tid?' with '+esc(tutor&&tutor.name?tutor.name:'tutor #'+tid):'')+'.</p><div class="nav" style="justify-content:center;gap:12px">'+'<a href="modivs-tutors.html" class="btn ghost" style="text-decoration:none;width:auto;padding:12px 24px;margin:0">Browse tutors</a></div></div>';
 window.scrollTo(0,0);
});
})();
</script>
